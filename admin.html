<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F8F8;--surface:#FFF;--surface2:#F6F5F3;--surface3:#E5E4E1;
  --border:#E5E4E1;--border2:#CCC8C4;
  --text:#191919;--text2:#727272;--text3:#B5B5B5;
  --pend:#7A5200;--resol:#1A6B48;--alert:#C42828;
  --sans:'Manrope',sans-serif;--serif:'IBM Plex Serif',serif;--mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN ── */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);padding:40px;width:min(380px,100%)}
.login-logo{height:32px;margin-bottom:28px;display:block}
.login-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text);margin-bottom:6px}
.login-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px 12px;font-family:var(--sans);font-size:13px;outline:none}
.login-field input:focus{border-color:var(--text2)}
.login-btn{width:100%;background:var(--text);color:var(--surface);border:none;padding:11px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;letter-spacing:0.04em}
.login-btn:hover{opacity:0.85}
.login-err{font-family:var(--mono);font-size:11px;color:var(--alert);margin-top:10px;display:none}

/* ── LOADING / DENIED ── */
#screen-loading,#screen-denied{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px}
.loading-logo{height:36px;opacity:0.6}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}
.denied-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text)}

/* ── APP ── */
#screen-app{display:none}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 40px;display:flex;align-items:center;gap:24px}
.header-logo{height:32px}
.header-title{font-family:var(--serif);font-size:17px;font-weight:300;color:var(--text);flex:1}
.header-eyebrow{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:2px}
.user-name{font-family:var(--mono);font-size:10px;color:var(--text2)}
.logout-btn{background:none;border:none;font-family:var(--mono);font-size:9px;color:var(--text3);cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;margin-left:14px}
.logout-btn:hover{color:var(--alert)}

.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;display:flex;gap:2px}
.tab{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--text3);padding:13px 18px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:0.02em}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}

.main{padding:28px 40px 80px;max-width:980px}
.section-title{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}

/* ── USER LIST ── */
.user-card{background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
.user-card-head{padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer}
.user-card-head:hover{background:var(--surface2)}
.user-card-name{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--text)}
.user-card-email{font-family:var(--mono);font-size:10px;color:var(--text3)}
.user-global-badge{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:#FDF0F0;color:var(--alert)}
.user-card-count{font-family:var(--mono);font-size:10px;color:var(--text3);margin-left:auto}
.user-card-chevron{color:var(--text3);font-size:11px;transition:transform 0.15s}
.user-card.open .user-card-chevron{transform:rotate(90deg)}
.user-card-body{display:none;border-top:1px solid var(--border);padding:14px 18px;background:var(--surface2)}
.user-card.open .user-card-body{display:block}

.proj-access-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.proj-access-row:last-of-type{border-bottom:none}
.proj-access-name{font-family:var(--sans);font-size:12.5px;color:var(--text);flex:1}
.papel-badge{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.papel-badge.p-coordenador{background:#E4F2EE;color:var(--resol)}
.papel-badge.p-projetista{background:var(--surface3);color:var(--text2)}
.disc-tags-inline{display:flex;gap:3px;flex-wrap:wrap}
.d-tag{font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 6px;border-radius:2px;background:var(--surface3);color:var(--text2);border:1px solid var(--border2)}
.d-tag.d-ARQ{background:#EBF2F6;color:#2A6080;border-color:#C4D8E4}
.d-tag.d-HID{background:#E8F0F8;color:#1A5A8A;border-color:#B8D0E8}
.d-tag.d-EST{background:#F6EEE2;color:#7A4E14;border-color:#E4D0B0}
.d-tag.d-INT{background:#EEE8F6;color:#5A3490;border-color:#D4C0E8}
.d-tag.d-CLI{background:#E4F2EE;color:#166050;border-color:#B0D8CC}
.d-tag.d-ELE{background:#F4F4E0;color:#606000;border-color:#D8D890}
.d-tag.d-GAS{background:#F6EAE8;color:#802010;border-color:#E4B8B0}
.d-tag.d-PSG{background:#E8F4E8;color:#206420;border-color:#B0D4B0}
.d-tag.d-IMP{background:#F6E8EE;color:#802840;border-color:#E4B4C4}
.d-tag.d-MOD{background:#E8EEF8;color:#284088;border-color:#B8C8E8}
.proj-access-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{background:none;border:none;font-family:var(--mono);font-size:10px;color:var(--text3);cursor:pointer;text-decoration:underline;padding:0}
.icon-btn:hover{color:var(--text)}
.icon-btn.danger:hover{color:var(--alert)}
.no-access{font-family:var(--mono);font-size:10px;color:var(--text3);font-style:italic;padding:6px 0}

.add-access-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--border2);display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.add-access-form select,.add-access-form input{background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:6px 9px;font-family:var(--sans);font-size:11.5px;outline:none}
.disc-mini-picker{display:flex;gap:3px;flex-wrap:wrap;width:100%;margin-top:6px}
.disc-mini-chip{font-family:var(--mono);font-size:9px;padding:3px 7px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;border-radius:2px}
.disc-mini-chip.on{background:var(--surface3);border-color:var(--text2);color:var(--text)}
.add-access-btn{background:var(--text);color:var(--surface);border:none;padding:6px 14px;font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer}
.add-access-btn:hover{opacity:0.85}

/* ── NEW USER FORM ── */
.new-user-box{background:var(--surface);border:1px solid var(--border);padding:20px;margin-bottom:24px}
.form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.form-row input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 11px;font-family:var(--sans);font-size:12.5px;outline:none}
.form-row input:focus{border-color:var(--text2)}
.primary-btn{background:var(--text);color:var(--surface);border:none;padding:9px 18px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer}
.primary-btn:hover{opacity:0.85}
.help-text{font-family:var(--mono);font-size:9px;color:var(--text3);line-height:1.7;margin-top:10px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--surface);font-family:var(--mono);font-size:11px;padding:9px 15px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login">
  <div class="login-box">
    <img id="login-logo" class="login-logo" alt="OSPA">
    <div class="login-title">Administração</div>
    <div class="login-sub">Acesso restrito a administradores</div>
    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="login-email" name="email" placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading">
  <img id="loading-logo" class="loading-logo" alt="OSPA">
  <div class="loading-text" id="loading-text">Carregando…</div>
</div>

<!-- DENIED -->
<div id="screen-denied">
  <img id="denied-logo" class="loading-logo" alt="OSPA">
  <div class="denied-title">Acesso restrito</div>
  <div class="loading-text">Esta área é exclusiva para administradores.</div>
  <button class="logout-btn" style="margin-top:10px" onclick="doLogout()">Sair</button>
</div>

<!-- APP -->
<div id="screen-app">
  <div class="header">
    <img id="app-logo" class="header-logo" alt="OSPA">
    <div class="header-title"><span class="header-eyebrow">OSPA Compat</span>Administração</div>
    <span class="user-name" id="user-name-badge"></span>
    <button class="logout-btn" onclick="doLogout()">Sair</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="usuarios" onclick="switchTab('usuarios')">Usuários</div>
    <div class="tab" data-tab="novo" onclick="switchTab('novo')">Novo usuário</div>
  </div>
  <div class="main">
    <div id="tab-usuarios"></div>
    <div id="tab-novo" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

let SESSION = null;
let ME = null;
let USERS = [];
let ACCESS = [];   // all projeto_usuarios_v2 rows
let PROJECTS = [];
const DISCIPLINES = ['ARQ','HID','EST','INT','CLI','ELE','GAS','PSG','IMP','MOD'];

function setLogos(src) {
  ['login-logo','loading-logo','denied-logo','app-logo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.src = src;
  });
}
setLogos(LOGO_URL);

async function sbFetch(path, opts={}) {
  const headers = {'Content-Type':'application/json','apikey':SB_KEY, ...opts.headers};
  if (SESSION) headers['Authorization'] = 'Bearer ' + SESSION.access_token;
  return fetch(SB_URL + path, {...opts, headers});
}
async function api(method, table, body, qs) {
  const url = '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await sbFetch(url, {
    method,
    headers: method !== 'GET' ? {'Prefer':'return=representation'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.message || 'HTTP '+r.status); }
  return method === 'DELETE' ? null : r.json();
}

const SESSION_KEY = 'ospa_session';
function saveSession(s) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e) {} }
function loadSavedSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } }
function clearSavedSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} }

async function refreshSession(refreshToken) {
  const r = await fetch(SB_AUTH + '/token?grant_type=refresh_token', {
    method: 'POST', headers: {'Content-Type':'application/json','apikey':SB_KEY},
    body: JSON.stringify({refresh_token: refreshToken})
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || 'Sessão expirada');
  return data;
}

async function tryRestoreSession() {
  const saved = loadSavedSession();
  if (!saved || !saved.refresh_token) return false;
  try {
    SESSION = await refreshSession(saved.refresh_token);
    saveSession(SESSION);
    return true;
  } catch(e) {
    clearSavedSession();
    return false;
  }
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) { showLoginErr('Preencha email e senha.'); return; }
  document.getElementById('login-btn').textContent = 'Entrando…';
  try {
    const r = await fetch(SB_AUTH + '/token?grant_type=password', {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas');
    SESSION = data;
    saveSession(SESSION);
    await loadApp();
  } catch(e) {
    showLoginErr(e.message);
    document.getElementById('login-btn').textContent = 'Entrar';
  }
}
function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}
function doLogout() {
  SESSION = null; ME = null;
  clearSavedSession();
  show('login');
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').textContent = 'Entrar';
}
function show(screen) {
  ['login','loading','denied','app'].forEach(s => {
    const el = document.getElementById('screen-'+s);
    if (el) el.style.display = s === screen ? (s==='app'?'block':'flex') : 'none';
  });
}

async function loadApp() {
  show('loading'); setLoadingText('Verificando permissões…');
  try {
    const uid = SESSION.user.id;
    const meArr = await api('GET','usuarios',null,'id=eq.'+uid);
    if (!meArr.length || meArr[0].papel_global !== 'admin') { show('denied'); return; }
    ME = meArr[0];

    setLoadingText('Carregando dados…');
    const [users, access, projects] = await Promise.all([
      api('GET','usuarios',null,'order=nome.asc'),
      api('GET','projeto_usuarios_v2',null,'order=created_at.asc'),
      api('GET','projetos',null,'order=nome.asc&select=id,nome'),
    ]);
    USERS = users; ACCESS = access; PROJECTS = projects;

    document.getElementById('user-name-badge').textContent = ME.nome;
    renderUsersTab();
    renderNewUserTab();
    show('app');
  } catch(e) {
    setLoadingText('Erro: ' + e.message);
  }
}
function setLoadingText(t) { document.getElementById('loading-text').textContent = t; }

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('tab-usuarios').style.display = name === 'usuarios' ? 'block' : 'none';
  document.getElementById('tab-novo').style.display = name === 'novo' ? 'block' : 'none';
}

// ── USERS TAB ──
function renderUsersTab() {
  const el = document.getElementById('tab-usuarios');
  el.innerHTML = '<div class="section-title">Usuários cadastrados (' + USERS.length + ')</div>';

  USERS.forEach(u => {
    const card = document.createElement('div'); card.className = 'user-card'; card.id = 'ucard-'+u.id;
    const accessRows = ACCESS.filter(a => a.usuario_id === u.id);

    const head = document.createElement('div'); head.className = 'user-card-head';
    head.onclick = () => card.classList.toggle('open');
    head.innerHTML =
      '<span class="user-card-chevron">&#9656;</span>' +
      '<div><div class="user-card-name">'+esc(u.nome)+'</div><div class="user-card-email">'+esc(u.email)+'</div></div>' +
      (u.papel_global === 'admin' ? '<span class="user-global-badge">Admin global</span>' : '') +
      '<span class="user-card-count">'+accessRows.length+' projeto'+(accessRows.length===1?'':'s')+'</span>';
    card.appendChild(head);

    const body = document.createElement('div'); body.className = 'user-card-body';
    if (u.papel_global === 'admin') {
      body.innerHTML = '<div class="no-access">Administradores globais têm acesso irrestrito a todos os projetos automaticamente.</div>';
    } else {
      if (!accessRows.length) {
        const none = document.createElement('div'); none.className = 'no-access';
        none.textContent = 'Nenhum acesso a projetos ainda.';
        body.appendChild(none);
      } else {
        accessRows.forEach(a => body.appendChild(renderAccessRow(u, a)));
      }
      body.appendChild(renderAddAccessForm(u));
    }
    card.appendChild(body);
    el.appendChild(card);
  });
}

function renderAccessRow(u, a) {
  const proj = PROJECTS.find(p => p.id === a.projeto_id);
  const row = document.createElement('div'); row.className = 'proj-access-row';
  row.innerHTML =
    '<span class="proj-access-name">'+esc(proj ? proj.nome : a.projeto_id)+'</span>' +
    '<span class="papel-badge p-'+a.papel+'">'+a.papel+'</span>';
  const tags = document.createElement('div'); tags.className = 'disc-tags-inline';
  (a.disciplinas||[]).forEach(d => {
    const t = document.createElement('span'); t.className = 'd-tag d-'+d; t.textContent = d;
    tags.appendChild(t);
  });
  row.appendChild(tags);
  const actions = document.createElement('div'); actions.className = 'proj-access-actions';
  const editBtn = document.createElement('button'); editBtn.className = 'icon-btn'; editBtn.textContent = 'Editar';
  editBtn.onclick = e => { e.stopPropagation(); editAccessInline(u, a, row); };
  const delBtn = document.createElement('button'); delBtn.className = 'icon-btn danger'; delBtn.textContent = 'Remover';
  delBtn.onclick = e => { e.stopPropagation(); removeAccess(a); };
  actions.appendChild(editBtn); actions.appendChild(delBtn);
  row.appendChild(actions);
  return row;
}

function editAccessInline(u, a, rowEl) {
  rowEl.innerHTML = '';
  const papelSel = document.createElement('select');
  ['coordenador','projetista'].forEach(p => {
    const o = document.createElement('option'); o.value = p; o.textContent = p;
    if (a.papel === p) o.selected = true;
    papelSel.appendChild(o);
  });
  const discPicker = document.createElement('div'); discPicker.className = 'disc-mini-picker';
  DISCIPLINES.forEach(d => {
    const chip = document.createElement('span');
    chip.className = 'disc-mini-chip' + ((a.disciplinas||[]).includes(d) ? ' on' : '');
    chip.textContent = d; chip.dataset.disc = d;
    chip.onclick = () => chip.classList.toggle('on');
    discPicker.appendChild(chip);
  });
  const saveBtn = document.createElement('button'); saveBtn.className = 'add-access-btn'; saveBtn.textContent = 'Salvar';
  saveBtn.onclick = async () => {
    const novoPapel = papelSel.value;
    const novasDiscs = Array.from(discPicker.querySelectorAll('.on')).map(c => c.dataset.disc);
    try {
      await api('PATCH','projeto_usuarios_v2',{papel:novoPapel, disciplinas:novasDiscs},'id=eq.'+a.id);
      a.papel = novoPapel; a.disciplinas = novasDiscs;
      toast('Atualizado');
      renderUsersTab();
      document.getElementById('ucard-'+u.id).classList.add('open');
    } catch(e) { toast('Erro: '+e.message); }
  };
  const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;width:100%';
  const topRow = document.createElement('div'); topRow.style.cssText = 'display:flex;gap:8px;align-items:center';
  topRow.appendChild(papelSel); topRow.appendChild(saveBtn);
  wrap.appendChild(topRow); wrap.appendChild(discPicker);
  rowEl.appendChild(wrap);
}

function renderAddAccessForm(u) {
  const existingProjIds = ACCESS.filter(a => a.usuario_id === u.id).map(a => a.projeto_id);
  const availableProjects = PROJECTS.filter(p => !existingProjIds.includes(p.id));

  const form = document.createElement('div'); form.className = 'add-access-form';
  if (!availableProjects.length) {
    form.innerHTML = '<div class="no-access">Já tem acesso a todos os projetos cadastrados.</div>';
    return form;
  }
  const projSel = document.createElement('select');
  availableProjects.forEach(p => {
    const o = document.createElement('option'); o.value = p.id; o.textContent = p.nome;
    projSel.appendChild(o);
  });
  const papelSel = document.createElement('select');
  [['projetista','Projetista'],['coordenador','Coordenador']].forEach(([v,t]) => {
    const o = document.createElement('option'); o.value = v; o.textContent = t;
    papelSel.appendChild(o);
  });
  const discPicker = document.createElement('div'); discPicker.className = 'disc-mini-picker';
  DISCIPLINES.forEach(d => {
    const chip = document.createElement('span'); chip.className = 'disc-mini-chip'; chip.textContent = d; chip.dataset.disc = d;
    chip.onclick = () => chip.classList.toggle('on');
    discPicker.appendChild(chip);
  });
  const addBtn = document.createElement('button'); addBtn.className = 'add-access-btn'; addBtn.textContent = '+ Adicionar';
  addBtn.onclick = async () => {
    const discs = Array.from(discPicker.querySelectorAll('.on')).map(c => c.dataset.disc);
    try {
      const res = await api('POST','projeto_usuarios_v2',{
        projeto_id: projSel.value, usuario_id: u.id, papel: papelSel.value,
        disciplinas: papelSel.value === 'projetista' ? discs : []
      });
      ACCESS.push(res[0]);
      toast('Acesso adicionado');
      renderUsersTab();
      document.getElementById('ucard-'+u.id).classList.add('open');
    } catch(e) { toast('Erro: '+e.message); }
  };
  form.appendChild(projSel); form.appendChild(papelSel); form.appendChild(addBtn); form.appendChild(discPicker);
  return form;
}

async function removeAccess(a) {
  const proj = PROJECTS.find(p => p.id === a.projeto_id);
  if (!confirm('Remover acesso a "'+(proj?proj.nome:a.projeto_id)+'"?')) return;
  try {
    await api('DELETE','projeto_usuarios_v2',null,'id=eq.'+a.id);
    ACCESS = ACCESS.filter(x => x.id !== a.id);
    toast('Acesso removido');
    renderUsersTab();
  } catch(e) { toast('Erro: '+e.message); }
}

// ── NEW USER TAB ──
function renderNewUserTab() {
  const el = document.getElementById('tab-novo');
  el.innerHTML = '';
  const box = document.createElement('div'); box.className = 'new-user-box';
  box.innerHTML =
    '<div class="section-title">Vincular usuário existente do Supabase Auth</div>' +
    '<div class="form-row">' +
      '<input type="text" id="new-uuid" placeholder="UUID do usuário (Supabase Auth)">' +
    '</div>' +
    '<div class="form-row">' +
      '<input type="text" id="new-nome" placeholder="Nome completo">' +
      '<input type="email" id="new-email" placeholder="Email">' +
    '</div>';
  const btn = document.createElement('button'); btn.className = 'primary-btn'; btn.textContent = 'Cadastrar';
  btn.onclick = createUser;
  box.appendChild(btn);
  const help = document.createElement('div'); help.className = 'help-text';
  help.innerHTML = 'Para criar a conta (email + senha), use o painel do Supabase em <b>Authentication → Users → Add user</b> (marque "Auto Confirm User"). Copie o UUID gerado e cole acima para vincular ao sistema. Depois de cadastrado, vá até a aba <b>Usuários</b> para conceder acesso a projetos específicos.';
  box.appendChild(help);
  el.appendChild(box);
}

async function createUser() {
  const uuid  = document.getElementById('new-uuid').value.trim();
  const nome  = document.getElementById('new-nome').value.trim();
  const email = document.getElementById('new-email').value.trim();
  if (!uuid || !nome || !email) { toast('Preencha todos os campos.'); return; }
  const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if (!uuidRe.test(uuid)) { toast('UUID inválido.'); return; }
  try {
    const res = await api('POST','usuarios',{id:uuid, nome, email});
    USERS.push(res[0]);
    USERS.sort((a,b) => a.nome.localeCompare(b.nome));
    toast('Usuário cadastrado');
    document.getElementById('new-uuid').value = '';
    document.getElementById('new-nome').value = '';
    document.getElementById('new-email').value = '';
    renderUsersTab();
    switchTab('usuarios');
  } catch(e) { toast('Erro: '+e.message); }
}

// ── UTILS ──
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── INIT ──
document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); doLogin(); });

(async () => {
  show('loading');
  setLoadingText('Restaurando sessão…');
  const restored = await tryRestoreSession();
  if (restored) { await loadApp(); } else { show('login'); }
})();
</script>
