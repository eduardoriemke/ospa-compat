<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="sidebar.css?v=3">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F8F8;--surface:#FFF;--surface2:#F6F5F3;--surface3:#E5E4E1;
  --border:#E5E4E1;--border2:#CCC8C4;
  --text:#191919;--text2:#727272;--text3:#B5B5B5;
  --pend:#7A5200;--resol:#1A6B48;--alert:#C42828;
  --ciente:#1A6B48;--analise:#7A5200;--inviavel:#C42828;
  --sans:'Manrope',sans-serif;--serif:'IBM Plex Serif',serif;--mono:'IBM Plex Mono',monospace;
}

body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN (idêntico ao projeto.html — mesma sessão compartilhada) ── */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);padding:40px;width:min(380px,100%)}
.login-logo{height:32px;margin-bottom:28px;display:block}
.login-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text);margin-bottom:6px}
.login-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px 12px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color 0.12s}
.login-field input:focus{border-color:var(--text2)}
.login-btn{width:100%;background:var(--text);color:var(--surface);border:none;padding:11px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity 0.1s;letter-spacing:0.04em}
.login-btn:hover{opacity:0.85}
.login-err{font-family:var(--mono);font-size:11px;color:var(--alert);margin-top:10px;display:none}

/* ── LOADING ── */
#screen-loading{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.loading-logo{height:36px;opacity:0.6}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}

/* ── APP ── */
/* ── LAYOUT (sidebar sempre presente — "casca" fixa da página; só o
   conteúdo à direita troca entre login/loading/app) ── */
.app-shell{display:flex;min-height:100vh}
.shell-content{flex:1;min-width:0;display:flex;flex-direction:column}
#screen-app{display:none} /* controlado via JS (show()) */

/* ── SUMMARY ── */
.summary{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 40px;display:flex;align-items:center}
.sum-item{font-family:var(--mono);font-size:11px;color:var(--text3);cursor:pointer;padding:4px 12px;border:1px solid transparent;border-radius:2px;display:flex;align-items:baseline;gap:6px;white-space:nowrap;transition:all 0.1s;user-select:none}
.sum-item:hover{color:var(--text2);border-color:var(--border2)}
.sum-item.on{color:var(--text);background:var(--surface3);border-color:var(--text2)}
.sum-item b{font-size:13px;font-weight:600}
.sum-item .sum-lbl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase}

/* ── FILTERS ── */
.filters{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(25,25,25,0.05)}
.filter-row{padding:7px 40px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.filter-row+.filter-row{border-top:1px solid var(--border)}
.f-lbl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);white-space:nowrap;margin-right:2px;width:90px;flex-shrink:0}
.chip{font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;transition:all 0.1s;white-space:nowrap;user-select:none}
.chip:hover{border-color:var(--text2);color:var(--text2)}
.chip.on{background:var(--surface3);border-color:var(--text2);color:var(--text)}
.chip.on.d-ARQ{border-color:#2A6080;color:#2A6080;background:#EBF2F6}
.chip.on.d-HID{border-color:#1A5A8A;color:#1A5A8A;background:#E8F0F8}
.chip.on.d-EST{border-color:#7A4E14;color:#7A4E14;background:#F6EEE2}
.chip.on.d-INT{border-color:#5A3490;color:#5A3490;background:#EEE8F6}
.chip.on.d-CLI{border-color:#166050;color:#166050;background:#E4F2EE}
.chip.on.d-ELE{border-color:#606000;color:#606000;background:#F4F4E0}
.chip.on.d-GAS{border-color:#802010;color:#802010;background:#F6EAE8}
.chip.on.d-PSG{border-color:#206420;color:#206420;background:#E8F4E8}
.chip.on.d-IMP{border-color:#802840;color:#802840;background:#F6E8EE}
.chip.on.d-MOD{border-color:#284088;color:#284088;background:#E8EEF8}
.chip.on.d-PPCI{border-color:#B5530D;color:#B5530D;background:#FBEEE2}
.chip.on.d-ACU{border-color:#9A3520;color:#9A3520;background:#F8E6E0}
.chip.on.d-CVI{border-color:#B03060;color:#B03060;background:#FBE6EE}
.chip.on.d-FUN{border-color:#4A3A28;color:#4A3A28;background:#EFEAE2}
.chip.on.d-PIS{border-color:#0A7A8A;color:#0A7A8A;background:#E0F4F6}
.chip.on.d-LUM{border-color:#8A6A10;color:#8A6A10;background:#F8F2DE}
.chip.on.d-TOP{border-color:#4A5560;color:#4A5560;background:#EDF0F1}
.chip.on.d-CPT{border-color:var(--text);color:var(--surface);background:var(--text)}
.chip-toggle{font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 10px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;transition:all 0.1s}
.chip-toggle.on{border-color:var(--resol);color:var(--resol);background:#EAF6F0}
.search-input{font-family:var(--mono);font-size:10.5px;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:4px 9px;outline:none;min-width:180px;transition:border-color 0.12s}
.search-input:focus{border-color:var(--text2)}
.search-input::placeholder{color:var(--text3)}

/* ── MAIN ── */
.main{padding:24px 40px 80px}
.main-hdr{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3)}
.main-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grupos-btn{font-family:var(--mono);font-size:10px;color:var(--text3);background:none;border:1px solid var(--border2);padding:4px 10px;border-radius:2px;cursor:pointer;white-space:nowrap}
.grupos-btn:hover{border-color:var(--text2);color:var(--text)}
/* ── GERADOR DE NOMENCLATURA ── */
.gmodal{display:none;position:fixed;inset:0;background:rgba(25,25,25,0.45);z-index:3000;align-items:center;justify-content:center;padding:20px}
.gmodal.open{display:flex}
.gmodal-box{background:var(--surface);border:1px solid var(--border);padding:26px 28px;width:min(620px,100%);max-height:92vh;overflow:auto}
.gmodal-title{font-family:var(--serif);font-size:18px;font-weight:300}
.gmodal-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin:4px 0 20px}
.grid-campos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gfield label{display:block;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.gfield input,.gfield select{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:7px 9px;font-family:var(--mono);font-size:12px;outline:none;text-transform:uppercase}
.gfield input:focus,.gfield select:focus{border-color:var(--text2)}
.gfield.desativado{opacity:0.4;pointer-events:none}
.g-rev-wrap{display:flex;align-items:stretch;border:1px solid var(--border2);background:var(--bg)}
.g-rev-wrap input{border:none!important;flex:1;min-width:0}
.g-rev-btns{display:flex;flex-direction:column;border-left:1px solid var(--border2)}
.g-rev-btns button{flex:1;background:none;border:none;color:var(--text3);cursor:pointer;font-size:7px;line-height:1;padding:0 7px}
.g-rev-btns button:hover{color:var(--text);background:var(--surface2)}
.gresultado{margin-top:20px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border)}
.gresultado-lbl{font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.gresultado-nome{font-family:var(--mono);font-size:14px;color:var(--text);word-break:break-all}
.gresultado-aviso{font-family:var(--mono);font-size:10px;color:var(--pend);margin-top:6px}
.gcruzamento{font-family:var(--mono);font-size:10.5px;margin-top:10px;line-height:1.6}
.gcruzamento .gc-existe{color:var(--pend)}
.gcruzamento .gc-novo{color:var(--resol)}
.gcruzamento .gc-conflito{color:var(--alert)}
.gc-acao{font-family:var(--sans);font-size:10px;font-weight:600;margin-left:8px;padding:2px 8px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;border-radius:2px}
.gc-acao:hover{border-color:var(--text2);color:var(--text)}
.gmodal-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.gbtn{font-family:var(--sans);font-size:11px;font-weight:600;padding:8px 16px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
.gbtn:hover{border-color:var(--text2);color:var(--text)}
.gbtn-primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.gbtn-primary:hover{opacity:0.85;color:var(--surface)}
@media (max-width:720px){.grid-campos{grid-template-columns:repeat(2,1fr)}}

/* ── CABEÇALHO DE GRUPO (disciplina) ── */
.grupo-row{cursor:pointer;background:var(--surface2);border-top:1px solid var(--border2)}
.grupo-row:hover{background:var(--surface3)}
.grupo-td{padding:9px 14px!important}
/* Grade de colunas fixas: alinha todos os cabeçalhos entre si */
.grupo-linha{display:grid;grid-template-columns:14px 58px 150px 210px 1fr;align-items:center;gap:10px}
.grupo-seta{font-family:var(--mono);font-size:9px;color:var(--text3)}
.grupo-qtd{font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap}
.grupo-qtd b{color:var(--text);font-weight:600}
.grupo-data{font-family:var(--mono);font-size:10px;color:var(--text3);white-space:nowrap}
.grupo-dias{color:var(--text2)}
/* Servidor: caixinha sempre na mesma posição, texto cresce à direita */
.grupo-servidor{display:flex;align-items:center;gap:7px;white-space:nowrap}
.grupo-servidor-lbl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3)}
.rev-badge{font-family:var(--mono);font-size:9px;color:var(--text2);background:var(--surface2);border:1px solid var(--border2);padding:1px 6px;border-radius:2px;white-space:nowrap;cursor:pointer;margin-left:2px}
.rev-badge:hover{border-color:var(--text2);color:var(--text)}
.rev-row td{background:var(--surface2);border-bottom:1px dashed var(--border)!important}
.rev-row .doc-name{font-size:10.5px;color:var(--text2)}
.rev-indent{display:inline-block;width:16px;color:var(--text3);font-family:var(--mono);font-size:9px}
.novo-aviso{font-family:var(--mono);font-size:9px;color:var(--pend);border:1px solid var(--pend);background:#FBF3E0;padding:1px 6px;border-radius:2px;margin-left:8px;white-space:nowrap;vertical-align:middle}
.conf-info{font-family:var(--mono);font-size:9px;color:var(--resol);margin-left:8px;white-space:nowrap;vertical-align:middle}

/* ── DISC TAGS (badges de disciplina) ── */
.d-tag{font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 7px;border-radius:2px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);white-space:nowrap}
.d-tag.d-ARQ{background:#EBF2F6;color:#2A6080;border-color:#C4D8E4}
.d-tag.d-HID{background:#E8F0F8;color:#1A5A8A;border-color:#B8D0E8}
.d-tag.d-EST{background:#F6EEE2;color:#7A4E14;border-color:#E4D0B0}
.d-tag.d-INT{background:#EEE8F6;color:#5A3490;border-color:#D4C0E8}
.d-tag.d-CLI{background:#E4F2EE;color:#166050;border-color:#B0D8CC}
.d-tag.d-ELE{background:#F4F4E0;color:#606000;border-color:#D8D890}
.d-tag.d-GAS{background:#F6EAE8;color:#802010;border-color:#E4B8B0}
.d-tag.d-PSG{background:#E8F4E8;color:#206420;border-color:#B0D4B0}
.d-tag.d-IMP{background:#F6E8EE;color:#802840;border-color:#E4B4C4}
.d-tag.d-MOD{background:#E8EEF8;color:#284088;border-color:#B8C8E8}
.d-tag.d-PPCI{background:#FBEEE2;color:#B5530D;border-color:#ECD0B0}
.d-tag.d-ACU{background:#F8E6E0;color:#9A3520;border-color:#EAC0B0}
.d-tag.d-CVI{background:#FBE6EE;color:#B03060;border-color:#EEC0D4}
.d-tag.d-FUN{background:#EFEAE2;color:#4A3A28;border-color:#D4C8B4}
.d-tag.d-PIS{background:#E0F4F6;color:#0A7A8A;border-color:#A8DCE2}
.d-tag.d-LUM{background:#F8F2DE;color:#8A6A10;border-color:#E0D0A0}
.d-tag.d-TOP{background:#EDF0F1;color:#4A5560;border-color:#CDD4D8}
.d-tag.d-CPT{background:var(--text);color:var(--surface);border-color:var(--text);font-weight:600}

/* ── TABLE ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);overflow-x:auto}
.doc-table{width:100%;border-collapse:collapse;min-width:720px}
.doc-table th{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);text-align:left;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;cursor:pointer;user-select:none}
.doc-table th:hover{color:var(--text2)}
.doc-table th.sorted{color:var(--text)}
.doc-table th.no-sort{cursor:default}
.doc-table th.no-sort:hover{color:var(--text3)}
.doc-table td{font-family:var(--sans);font-size:12.5px;color:var(--text);padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.doc-table tbody tr:last-child td{border-bottom:none}
.doc-table tbody tr:hover{background:var(--surface2)}
.doc-row.nao-vigente{opacity:0.45}
.doc-name{font-family:var(--mono);font-size:11.5px;color:var(--text)}
.doc-name-link{text-decoration:none;border-bottom:1px solid var(--border2);cursor:pointer}
.doc-name-link:hover{color:var(--text2);border-color:var(--text2)}
.doc-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.doc-tag{font-family:var(--mono);font-size:8.5px;padding:1px 6px;border-radius:2px;white-space:nowrap}
.doc-tag-invalido{color:var(--text3);border:1px dashed var(--border2)}
.doc-tag-naovigente{color:var(--text2);background:var(--surface3)}
.doc-mono{font-family:var(--mono);font-size:11px;color:var(--text2)}
.doc-tipo{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;border-radius:2px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap}
/* Formatos com identidade visual, para varrer a lista com o olho */
.doc-tipo.f-dwg{background:#EAF2F8;color:#1A5A8A;border-color:#BBD5E8}
.doc-tipo.f-dxf{background:#EAF2F8;color:#3A6E9A;border-color:#C6DCEC}
.doc-tipo.f-dwl{background:#F2F4F6;color:#6A7A88;border-color:#D6DDE3}
.doc-tipo.f-pdf{background:#FBEAEA;color:#A32B2B;border-color:#EEC2C2}
.doc-tipo.f-ifc{background:#EAF6EF;color:#1A6B48;border-color:#BFE0CE}
.doc-tipo.f-rvt{background:#F3EDFA;color:#5A3490;border-color:#D8C9EC}
.doc-tipo.f-skp{background:#FDF0E4;color:#B5530D;border-color:#F0D5B8}
.doc-tipo.f-xlsx,.doc-tipo.f-xls,.doc-tipo.f-csv{background:#EDF7EC;color:#2C6E2C;border-color:#C8E4C6}
.doc-tipo.f-docx,.doc-tipo.f-doc{background:#EAF0FA;color:#26478D;border-color:#C3D2EC}
.doc-tipo.f-jpg,.doc-tipo.f-jpeg,.doc-tipo.f-png{background:#FAF0F5;color:#8E3060;border-color:#EBC9DA}
.doc-tamanho{font-family:var(--mono);font-size:10.5px;color:var(--text3);white-space:nowrap}
.doc-pasta-link{font-family:var(--mono);font-size:11px;color:var(--text2);text-decoration:none;border-bottom:1px dotted var(--border2)}
.doc-pasta-link:hover{color:var(--text);border-color:var(--text2)}
.tag-novo{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--resol);background:#EAF6F0;border:1px solid #BFE0CE;padding:1px 5px;border-radius:2px;white-space:nowrap}
/* Cabeçalho da disciplina acompanha a rolagem dentro do grupo */
.grupo-row td{position:sticky;top:0;z-index:20;background:var(--surface2)}
.doc-link{font-family:var(--mono);font-size:10.5px;color:var(--text2);text-decoration:none;border:1px solid var(--border2);padding:4px 10px;border-radius:2px;white-space:nowrap;display:inline-block}
.doc-link:hover{border-color:var(--text2);color:var(--text)}
.empty-state{padding:70px 20px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:11px}
.doc-checkbox{width:14px;height:14px;cursor:pointer;accent-color:var(--text)}

/* ── MOBILE ── */
@media (max-width: 720px) {
  .summary{padding:8px 16px;overflow-x:auto}
  .filter-row{padding:7px 16px;gap:4px}
  .f-lbl{width:auto;min-width:auto}
  .main{padding:14px 16px 60px}
  .grupo-linha{display:flex;flex-wrap:wrap;gap:8px}
  .grupo-servidor{margin-left:auto}
  .login-box{padding:28px 22px}
}
</style>
</head>
<body data-page="documentos">

<div class="app-shell">
  <div id="ospa-sidebar"></div>
  <div class="shell-content">

<!-- LOGIN -->
<div id="screen-login">
  <div class="login-box">
    <img id="login-logo" class="login-logo" alt="OSPA">
    <div class="login-title">Controle de Documentos</div>
    <div class="login-sub">Acesso restrito</div>
    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="login-email" name="email" placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading">
  <img id="loading-logo" class="loading-logo" alt="OSPA">
  <div class="loading-text" id="loading-text">Carregando…</div>
</div>

<!-- APP -->
<div id="screen-app">
  <div class="summary" id="summary"></div>
  <div class="filters" id="filters"></div>
  <!-- Gerador de nomenclatura — padrão Latitude -->
  <div class="gmodal" id="modal-gerador">
    <div class="gmodal-box">
      <div class="gmodal-title">Gerar nome de arquivo</div>
      <div class="gmodal-sub">7 campos · código, disciplina, etapa, numeração, pavimento, desenho e revisão</div>

      <div class="grid-campos">
        <div class="gfield"><label id="g-codigo-lbl">01 · Código da obra</label><input id="g-codigo" maxlength="2" placeholder="10"></div>

// ── SUPABASE HELPERS (idêntico ao projeto.html) ──
async function api(method, table, body, qs, customHeaders) {
  const url = '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await sbFetch(url, {
    method,
    headers: customHeaders || (method !== 'GET' ? {'Prefer':'return=representation'} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.message || 'HTTP ' + r.status);
  }
  return (method === 'DELETE' || (customHeaders && customHeaders.Prefer && customHeaders.Prefer.indexOf('return=minimal') >= 0)) ? null : r.json();
}

// Busca TODAS as linhas de uma consulta, em páginas de 1000.
// O Supabase limita cada consulta a 1000 linhas — sem isso, projetos
// com mais de 1000 documentos ficariam parcialmente invisíveis.
async function apiTodos(table, qs) {
  const PAGINA = 1000;
  let resultado = [];
  let offset = 0;
  while (true) {
    const lote = await api('GET', table, null,
      qs + '&limit=' + PAGINA + '&offset=' + offset);
    resultado = resultado.concat(lote);
    if (lote.length < PAGINA) break;
    offset += PAGINA;
  }
  return resultado;
}

// ── AUTH (idêntico ao projeto.html — mesma chave de sessão) ──
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-err');
  err.style.display = 'none';

  if (!email || !pass) { showLoginErr('Preencha email e senha.'); return; }

  document.getElementById('login-btn').textContent = 'Entrando…';
  try {
    const r = await fetch(SB_AUTH + '/token?grant_type=password', {
      method: 'POST',
      headers: {'Content-Type':'application/json','apikey':SB_KEY},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas');
    SESSION = data;
    saveSession(SESSION);
    await loadApp();
  } catch(e) {
    showLoginErr(e.message);
    document.getElementById('login-btn').textContent = 'Entrar';
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function doLogout() {
  SESSION = null; USER_PROFILE = null;
  clearSavedSession();
  show('login');
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').textContent = 'Entrar';
}

// ── LOAD APP ──
async function loadApp() {
  show('loading');
  setLoadingText('Identificando usuário…');

  const params = new URLSearchParams(window.location.search);
  const projId = params.get('id');

  if (!projId) {
    setLoadingText('Nenhum projeto especificado. Use ?id=CODIGO na URL.');
    return;
  }

  try {
    // Mesma verificação de permissão do projeto.html: admin vê tudo,
    // outros usuários precisam ter vínculo com este projeto específico.
    const uid = SESSION.user.id;
    const meArr = await api('GET','usuarios',null,'id=eq.'+uid);
    if (!meArr || !meArr.length) {
      setLoadingText('Usuário não cadastrado no sistema.');
      return;
    }
    const me = meArr[0];

    if (me.papel_global === 'admin') {
      USER_PROFILE = { id: uid, email: me.email, nome: me.nome, papel: 'admin', disciplinas: [] };
    } else {
      const perfis = await api('GET','projeto_usuarios_v2',null,
        'usuario_id=eq.'+uid+'&projeto_id=eq.'+projId);
      if (!perfis || !perfis.length) {
        setLoadingText('Você não tem acesso a este projeto.');
        return;
      }
      USER_PROFILE = {
        id: uid, email: me.email, nome: me.nome,
        papel: perfis[0].papel, disciplinas: perfis[0].disciplinas || []
      };
    }

    setLoadingText('Carregando documentos…');

    const [proj, cfg, docs] = await Promise.all([
      api('GET','projetos',null,'id=eq.'+projId).then(r=>r[0]),
      api('GET','config_projeto',null,'projeto_id=eq.'+projId).then(r=>r[0]||{}),
      apiTodos('documentos_projeto',
        'projeto_id=eq.'+projId+'&removido_em=is.null&order=disciplina.asc,nome_arquivo.asc'),
    ]);

    PROJETO = proj;
    DOCS = docs;
    CONFIG.locais = cfg.locais || [];   // pavimentos cadastrados no editor

    // Confirmações de "atualizado no servidor" por disciplina
    // (estado compartilhado do projeto — todos veem o mesmo)
    try {
      const confs = await api('GET','disciplina_confirmacoes',null,'projeto_id=eq.'+projId);
      CONFIRMACOES = {};
      confs.forEach(c => { CONFIRMACOES[c.disciplina] = c; });
    } catch (erro) {
      console.error('Não foi possível carregar confirmações de servidor:', erro);
      CONFIRMACOES = {};
    }

    CONFIG.disciplines = [...new Set(DOCS.map(d => d.disciplina))].filter(Boolean).sort();
    // Compatibilização (CPT) não é uma disciplina técnica como as outras —
    // é o resultado consolidado. Fica sempre em primeiro no filtro.
    if (CONFIG.disciplines.includes('CPT')) {
      CONFIG.disciplines = ['CPT', ...CONFIG.disciplines.filter(d => d !== 'CPT')];
    }
    CONFIG.tipos = [...new Set(DOCS.map(d => (d.tipo||'').toUpperCase()))].filter(Boolean).sort();
    CONFIG.etapas = [...new Set(DOCS.map(d => d.etapa))].filter(Boolean).sort();

    // hdr-back-link agora é um link fixo pra index.html (definido no HTML)

    S.discs = new Set();

    renderHeader();

    // Atalho para a pasta raiz no Drive, quando o Apps Script já a registrou
    const elDrive = document.getElementById('link-drive');
    if (PROJETO.link_drive) {
      elDrive.href = PROJETO.link_drive;
      elDrive.style.display = 'inline-block';
    }

    renderSummary();
    renderFilters();
    renderTableHead();
    renderDocs();
    show('app');

  } catch(e) {
    setLoadingText('Erro: ' + e.message);
    console.error(e);
  }
}

function show(screen) {
  ['login','loading','app'].forEach(s => {
    const el = document.getElementById('screen-'+s);
    if (!el) return;
    if (s !== screen) { el.style.display = 'none'; return; }
    el.style.display = (s === 'app') ? 'block' : 'flex';
  });
  // Sidebar fica escondido só na tela de login (sem sessão ainda não faz
  // sentido mostrar navegação); em loading/app ele permanece visível o tempo
  // todo, então só o conteúdo à direita mostra o "carregando…".
  const sb = document.getElementById('ospa-sidebar');
  if (sb) sb.style.display = (screen === 'login') ? 'none' : '';
}

// ── RENDER SUMMARY (barra de visão: todos / vigentes / arquivados) ──
function renderSummary() {
  const el = document.getElementById('summary');
  el.innerHTML = '';

  const pilhas     = montarPilhas(DOCS);
  const total      = pilhas.length;
  const arquivados = pilhas.filter(p => p.arquivos.every(a => !a.vigente)).length;
  const vigentes   = total - arquivados;

  const ctr = document.createElement('div');
  ctr.style.cssText = 'display:flex;align-items:center;width:100%;flex-wrap:wrap;gap:5px';

  // Rótulo vazio com a mesma largura dos rótulos de filtro,
  // pra alinhar os contadores na mesma coluna dos chips.
  const ghost = document.createElement('span');
  ghost.className = 'f-lbl';
  ctr.appendChild(ghost);

  const opcoes = [
    { chave: 'todos',      num: total,      rotulo: 'documentos' },
    { chave: 'vigentes',   num: vigentes,   rotulo: 'vigentes' },
    { chave: 'arquivados', num: arquivados, rotulo: 'arquivados' },
  ];

  opcoes.forEach(op => {
    const item = document.createElement('div');
    item.className = 'sum-item' + (S.visao === op.chave ? ' on' : '');
    item.innerHTML = '<b>' + op.num + '</b><span class="sum-lbl">' + op.rotulo + '</span>';
    item.onclick = () => {
      S.visao = op.chave;
      renderSummary();
      renderDocs();
    };
    ctr.appendChild(item);
  });

  el.appendChild(ctr);
}

// Quantos DOCUMENTOS (pilhas) existem por disciplina, formato e etapa.
// Considera a visão atual (vigentes/arquivados/todos), mas ignora o
// próprio filtro sendo contado — senão o número mudaria ao clicar nele.
function contarPor(campo) {
  const cont = {};
  montarPilhas(DOCS).forEach(p => {
    const d = p.topo;
    const arquivado = p.arquivos.every(a => !a.vigente);
    if (S.visao === 'vigentes' && arquivado) return;
    if (S.visao === 'arquivados' && !arquivado) return;
    let v = d[campo];
    if (campo === 'tipo') v = (v || '').toUpperCase();
    if (!v) return;
    cont[v] = (cont[v] || 0) + 1;
  });
  return cont;
}

// ════════════════════════════════════════════════════════
// GERADOR DE NOMENCLATURA — padrão OSPA/Latitude
// CÓDIGO(2)-DISCIPLINA-ETAPA-NUM(3)-PAVIMENTO(3)-DESENHO(3)-REVISÃO
// Sete campos fixos, todos com 3 caracteres. Sem campo de torre.
// Use GER no pavimento quando não se aplica (cortes, memoriais, quadros).
// ════════════════════════════════════════════════════════

const NOMES_DISCIPLINA = {
  ACU:'Acústica', AMB:'Ambiental', ARQ:'Arquitetura', CLI:'Climatização',
  COM:'Comunicações', CPT:'Compatibilização', CVI:'Comunicação visual',
  DRE:'Drenagem', ELE:'Elétrico', EST:'Estrutural', FUN:'Fundações',
  GAS:'Gás', HID:'Hidrossanitário', IMP:'Impermeabilização', INT:'Interiores',
  LUM:'Luminotécnico', MOD:'Modulação', PAI:'Paisagismo', PIS:'Piscina',
  PPCI:'PPCI', PSG:'Paisagismo', SIN:'Sinalética', TOP:'Topografia'
};

const NOMES_ETAPA = {
  EP:'Estudo preliminar', AP:'Anteprojeto', PB:'Projeto básico',
  PE:'Projeto executivo', PL:'Projeto legal', AB:'As built',
  PC:'Projeto complementar', RI:'Relatório', TH:'Técnico'
};

// Tipos de desenho observados nos arquivos do projeto, mais os básicos
const DESENHOS_BASE = {
  PLA:'Planta baixa', FOR:'Forro / formas', CRT:'Corte', DET:'Detalhe',
  ELN:'Elevação norte', ELS:'Elevação sul', ELL:'Elevação leste', ELO:'Elevação oeste',
  ISO:'Isométrico', MOD:'Modelo BIM', MEM:'Memorial', QUA:'Quadro',
  SIT:'Situação', ESG:'Esgoto', HID:'Hidráulica', ELE:'Elétrico', CLI:'Climatização',
  ILU:'Iluminação', PIS:'Piso', TEC:'Tecnologia', OBJ:'Objetos', FIX:'Fixos',
  POR:'Portas', FLU:'Fluxograma', QTV:'Quantitativo', GER:'Geral'
};

function abrirGerador() {
  const sel = document.getElementById('g-disc');
  if (!sel.options.length) montarGerador();
  document.getElementById('modal-gerador').classList.add('open');
  atualizarNome();
}

function fecharGerador() {
  document.getElementById('modal-gerador').classList.remove('open');
}

function montarGerador() {
  // Disciplinas e etapas: as que o projeto usa de fato
  const discsUso  = [...new Set(DOCS.map(d => d.disciplina).filter(Boolean))].sort();
  const etapasUso = [...new Set(DOCS.map(d => d.etapa).filter(Boolean))].sort();

  const sel = document.getElementById('g-disc');
  discsUso.forEach(cod => {
    const o = document.createElement('option');
    o.value = cod;
    o.textContent = NOMES_DISCIPLINA[cod] ? cod + ' — ' + NOMES_DISCIPLINA[cod] : cod;
    sel.appendChild(o);
  });

  const selEt = document.getElementById('g-etapa');
  etapasUso.forEach(cod => {
    const o = document.createElement('option');
    o.value = cod;
    o.textContent = NOMES_ETAPA[cod] ? cod + ' — ' + NOMES_ETAPA[cod] : cod;
    selEt.appendChild(o);
  });

  // Sugestões: o "conteúdo" guarda NUMERAÇÃO-PAVIMENTO-DESENHO
  const desUso = new Set(), ext = new Set();
  const codigos = {};
  DOCS.forEach(d => {
    if (d.codigo) codigos[d.codigo] = (codigos[d.codigo] || 0) + 1;
    if (d.tipo) ext.add(d.tipo.toLowerCase());
    const partes = (d.conteudo || '').split('-').filter(Boolean);
    if (partes.length >= 3) desUso.add(partes[2]);
  });

  // Código da obra: o mais frequente nos arquivos, com o nome do projeto ao lado
  const maisComum = Object.keys(codigos).sort((a,b) => codigos[b] - codigos[a])[0];
  if (maisComum) document.getElementById('g-codigo').value = maisComum;
  if (PROJETO && PROJETO.nome) {
    document.getElementById('g-codigo-lbl').textContent = '01 · Código da obra · ' + PROJETO.nome;
  }

  // Pavimentos: os cadastrados no editor têm prioridade — é a mesma lista
  // usada nos conflitos, então o sistema fala uma língua só.
  // Apenas os pavimentos cadastrados no projeto (editor) mais GER.
  // Não entram valores extraídos dos nomes de arquivo: ali o campo 05
  // foi usado para muita coisa que não é pavimento (cortes, isométricos,
  // quadros), e isso poluiria a lista.
  const selPav = document.getElementById('g-pav');
  [...new Set([...(CONFIG.locais || []), 'GER'])].sort().forEach(p => {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = p === 'GER' ? 'GER — geral / não se aplica' : p;
    selPav.appendChild(o);
  });

  preencherLista('lista-des', [...new Set([...Object.keys(DESENHOS_BASE), ...desUso])]);
  preencherLista('lista-ext', [...new Set([...ext, 'dwg','pdf','ifc','rvt'])]);

  ['g-codigo','g-disc','g-etapa','g-num','g-pav','g-des','g-rev','g-ext']
    .forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', atualizarNome);
      el.addEventListener('change', atualizarNome);
    });

  const elRev = document.getElementById('g-rev');
  elRev.addEventListener('blur', function() {
    this.value = normalizaRev(this.value);
    atualizarNome();
  });
}

// A revisão é sempre exibida como R00, R01… mesmo quando digitada só o número
function normalizaRev(valor) {
  const n = parseInt(String(valor).replace(/\D/g, ''), 10);
  return 'R' + String(isNaN(n) ? 0 : Math.max(0, Math.min(n, 99))).padStart(2, '0');
}

function ajustarRev(passo) {
  const el = document.getElementById('g-rev');
  const n = parseInt(String(el.value).replace(/\D/g, ''), 10) || 0;
  el.value = normalizaRev(Math.max(0, Math.min(n + passo, 99)));
  atualizarNome();
}

function preencherLista(id, valores) {
  const dl = document.getElementById(id);
  dl.innerHTML = '';
  valores.filter(Boolean).sort().forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    if (DESENHOS_BASE[v] && id === 'lista-des') o.label = DESENHOS_BASE[v];
    dl.appendChild(o);
  });
}

function atualizarNome() {
  const v = id => (document.getElementById(id).value || '').trim().toUpperCase();

  const codigo = v('g-codigo');
  const disc   = v('g-disc');
  const etapa  = v('g-etapa');
  const num    = v('g-num');
  const pav    = v('g-pav');
  const des    = v('g-des');
  const ext    = (document.getElementById('g-ext').value || '').trim().toLowerCase();

  const rev = normalizaRev(document.getElementById('g-rev').value);

  const avisos = [];
  if (codigo && !/^\d{2}$/.test(codigo)) avisos.push('código: 2 dígitos');
  if (num && !/^\d{3}$/.test(num))       avisos.push('numeração: 3 dígitos');
  if (pav && pav.length !== 3)            avisos.push('pavimento: 3 caracteres');

  const faltando = [];
  if (!codigo) faltando.push('código');
  if (!num)    faltando.push('numeração');
  if (!pav)    faltando.push('pavimento');
  if (!des)    faltando.push('desenho');
  if (!ext)    faltando.push('formato');

  const nome = [codigo, disc, etapa, num, pav, des, rev].filter(Boolean).join('-') +
               (ext ? '.' + ext : '');
  document.getElementById('g-saida').textContent = nome;

  const aviso = document.getElementById('g-aviso');
  if (faltando.length)    aviso.textContent = 'Falta preencher: ' + faltando.join(', ');
  else if (avisos.length) aviso.textContent = 'Corrigir — ' + avisos.join('; ');
  else                    aviso.textContent = '';

  document.getElementById('g-copiar').disabled = faltando.length > 0 || avisos.length > 0;

  cruzarComExistentes(codigo, disc, etapa, [num, pav, des].filter(Boolean).join('-'), num);
}

// Cruza com os documentos existentes: avisa se o documento já existe (e
// qual a próxima revisão), se a numeração está ocupada, e qual o próximo
// número livre da disciplina/etapa.
function cruzarComExistentes(codigo, disc, etapa, conteudo, num) {
  const el = document.getElementById('g-cruzamento');
  el.innerHTML = '';
  if (!codigo || !disc || !etapa) return;

  const mesmaEtapa = DOCS.filter(d =>
    d.codigo === codigo && d.disciplina === disc && d.etapa === etapa && d.nome_valido);

  const usados = new Set();
  mesmaEtapa.forEach(d => {
    const n = (d.conteudo || '').split('-')[0];
    if (/^\d{3}$/.test(n)) usados.add(parseInt(n, 10));
  });
  let livre = 1;
  while (usados.has(livre)) livre++;
  const proxLivre = String(livre).padStart(3, '0');

  const iguais = mesmaEtapa.filter(d => (d.conteudo || '') === conteudo);
  if (iguais.length) {
    const maxRev = Math.max(...iguais.map(d => parseInt((d.revisao || '').replace(/\D/g,'')) || 0));
    const linha = document.createElement('div');
    linha.className = 'gc-existe';
    linha.innerHTML = '<i class="ti ti-history" style="vertical-align:-2px"></i> Documento já existe · revisão atual R' +
                      String(maxRev).padStart(2,'0');
    const btn = document.createElement('button');
    btn.className = 'gc-acao';
    btn.textContent = 'usar R' + String(maxRev + 1).padStart(2,'0');
    btn.onclick = () => { document.getElementById('g-rev').value = normalizaRev(maxRev + 1); atualizarNome(); };
    linha.appendChild(btn);
    el.appendChild(linha);
    return;
  }

  if (/^\d{3}$/.test(num)) {
    const ocupada = mesmaEtapa.filter(d => (d.conteudo || '').split('-')[0] === num);
    if (ocupada.length) {
      const linha = document.createElement('div');
      linha.className = 'gc-conflito';
      linha.innerHTML = '<i class="ti ti-alert-triangle" style="vertical-align:-2px"></i> Numeração ' + num +
                        ' já usada por: ' + esc(ocupada[0].nome_arquivo);
      const btn = document.createElement('button');
      btn.className = 'gc-acao';
      btn.textContent = 'usar ' + proxLivre;
      btn.onclick = () => { document.getElementById('g-num').value = proxLivre; atualizarNome(); };
      linha.appendChild(btn);
      el.appendChild(linha);
      return;
    }
  }

  const linha = document.createElement('div');
  linha.className = 'gc-novo';
  linha.innerHTML = '<i class="ti ti-file-plus" style="vertical-align:-2px"></i> Documento novo · próxima numeração livre em ' +
                    disc + '/' + etapa + ': ' + proxLivre;
  if (num !== proxLivre) {
    const btn = document.createElement('button');
    btn.className = 'gc-acao';
    btn.textContent = 'usar ' + proxLivre;
    btn.onclick = () => { document.getElementById('g-num').value = proxLivre; atualizarNome(); };
    linha.appendChild(btn);
  }
  el.appendChild(linha);
}

async function copiarNome() {
  const nome = document.getElementById('g-saida').textContent;
  const btn = document.getElementById('g-copiar');
  try {
    await navigator.clipboard.writeText(nome);
    btn.textContent = 'Copiado \u2713';
    setTimeout(function(){ btn.textContent = 'Copiar nome'; }, 1600);
  } catch (e) {
    alert('Copie manualmente:\n\n' + nome);
  }
}

// ── EMPILHAMENTO DE REVISÕES ──
// Agrupa arquivos que são revisões do MESMO documento, usando a mesma
// chave que o Apps Script usa para calcular vigência.
// Arquivos com nome fora do padrão nunca empilham: sem código/etapa/
// conteúdo eles cairiam todos numa pilha falsa.

function chaveDocumento(d) {
  if (!d.nome_valido) return 'solto:' + d.id_arquivo_drive;
  return [d.codigo, d.disciplina, d.etapa, d.conteudo, d.tipo].join('|').toLowerCase();
}

function numeroRevisao(d) {
  return parseInt((d.revisao || '').replace(/\D/g, '')) || 0;
}

// Devolve uma lista de PILHAS. Cada pilha = { topo, revisoes[], chave }
// onde "topo" é a revisão mais recente e "revisoes" são as anteriores.
function montarPilhas(docs) {
  const mapa = {};
  docs.forEach(d => {
    const k = chaveDocumento(d);
    if (!mapa[k]) mapa[k] = [];
    mapa[k].push(d);
  });

  return Object.keys(mapa).map(k => {
    const arquivos = mapa[k].slice().sort((a, b) => numeroRevisao(b) - numeroRevisao(a));
    return { chave: k, topo: arquivos[0], revisoes: arquivos.slice(1), arquivos: arquivos };
  });
}

// Momento da última atividade de um documento: envio OU modificação,
// o que for mais recente. Cobre arquivo novo E substituição/nova versão
// de um arquivo existente com o mesmo nome.
function atividadeDoc(d) {
  const up  = d.data_upload      ? new Date(d.data_upload).getTime()      : 0;
  const mod = d.data_modificacao ? new Date(d.data_modificacao).getTime() : 0;
  return Math.max(up, mod);
}

function montarControleServidor(disc, atividade) {
  const td = document.createElement('div');
  td.className = 'grupo-servidor';
  td.onclick = (e) => e.stopPropagation(); // não expande/recolhe o grupo

  const conf = CONFIRMACOES[disc];
  const confMs = conf ? new Date(conf.confirmado_em).getTime() : 0;
  const atualizado = conf && confMs >= atividade;

  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.className = 'doc-checkbox';
  chk.checked = !!atualizado;
  if (conf) {
    chk.title = 'Confirmado por ' + (conf.confirmado_por || '?') + ' em ' + fmtDate(conf.confirmado_em);
  } else {
    chk.title = 'Marcar como atualizado no servidor';
  }

  chk.onchange = async () => {
    try {
      if (chk.checked) {
        const registro = {
          projeto_id: PROJETO.id,
          disciplina: disc,
          confirmado_em: new Date().toISOString(),
          confirmado_por: USER_PROFILE.nome
        };
        await api('POST', 'disciplina_confirmacoes', [registro],
          'on_conflict=projeto_id,disciplina',
          {'Prefer': 'resolution=merge-duplicates,return=minimal'});
        CONFIRMACOES[disc] = registro;
      } else {
        await api('DELETE', 'disciplina_confirmacoes', null,
          'projeto_id=eq.' + encodeURIComponent(PROJETO.id) +
          '&disciplina=eq.' + encodeURIComponent(disc));
        delete CONFIRMACOES[disc];
      }
      renderDocs();
    } catch (erro) {
      alert('Não foi possível salvar a confirmação: ' + erro.message);
      renderDocs();
    }
  };
  const lbl = document.createElement('span');
  lbl.className = 'grupo-servidor-lbl';
  lbl.textContent = 'servidor';
  td.appendChild(lbl);
  td.appendChild(chk);

  // Confirmado e em dia → mostra quem e quando, visível sem tooltip
  if (atualizado) {
    const okInfo = document.createElement('span');
    okInfo.className = 'conf-info';
    okInfo.textContent = (conf.confirmado_por ? conf.confirmado_por + ' · ' : '') + fmtDate(conf.confirmado_em);
    td.appendChild(okInfo);
  }

  // Confirmação existe mas chegou coisa nova depois dela → aviso
  if (conf && !atualizado) {
    const novos = DOCS.filter(d => d.disciplina === disc && atividadeDoc(d) > confMs).length;
    const aviso = document.createElement('span');
    aviso.className = 'novo-aviso';
    aviso.textContent = novos + (novos === 1 ? ' novo' : ' novos');
    aviso.title = 'Arquivos novos ou alterados desde a última confirmação (' + fmtDate(conf.confirmado_em) + ')';
    td.appendChild(aviso);
  }

  return td;
}

// ── RENDER TABLE HEAD (ordenável) ──
// A disciplina saiu da tabela: as linhas já vêm agrupadas por ela,
// então o badge se repetia em todas as linhas do grupo.
const COLUMNS = [
  { field: 'caminho',          label: 'Caminho' },
  { field: 'nome_arquivo',     label: 'Nome do arquivo' },
  { field: 'etapa',            label: 'Etapa' },
  { field: 'revisao',          label: 'Revisão' },
  { field: 'tipo',             label: 'Formato' },
  { field: 'tamanho_mb',       label: 'Tamanho' },
  { field: 'data_upload',      label: 'Enviado em' },
  { field: 'data_modificacao', label: 'Modificado em' },
];

function renderTableHead() {
  const thead = document.getElementById('doc-thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');

  COLUMNS.forEach(col => {
    const th = document.createElement('th');
    const active = S.sortBy === col.field;
    th.className = active ? 'sorted' : '';
    let arrow = '';
    if (active) arrow = S.sortDir === 'asc' ? ' \u25b2' : ' \u25bc';
    th.textContent = col.label + arrow;
    th.onclick = () => {
      if (S.sortBy === col.field) { S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc'; }
      else { S.sortBy = col.field; S.sortDir = col.field.indexOf('data_') === 0 ? 'desc' : 'asc'; }
      renderTableHead();
      renderDocs();
    };
    tr.appendChild(th);
  });

    thead.appendChild(tr);
}

// ── SORT ──
// Ordena pilhas pelo documento do topo
function sortDocs(list) {
  const isDate = S.sortBy === 'data_upload' || S.sortBy === 'data_modificacao';
  const mult = S.sortDir === 'asc' ? 1 : -1;
  return [...list].sort((pa, pb) => {
    const a = pa.topo, b = pb.topo;
    let av = a[S.sortBy], bv = b[S.sortBy];
    if (isDate) {
      av = av ? new Date(av).getTime() : 0;
      bv = bv ? new Date(bv).getTime() : 0;
    } else {
      av = (av || '').toString().toLowerCase();
      bv = (bv || '').toString().toLowerCase();
    }
    if (av < bv) return -1 * mult;
    if (av > bv) return 1 * mult;
    return (a.nome_arquivo || '').localeCompare(b.nome_arquivo || '');
  });
}

// ── RENDER DOCS ──
// Filtra por DOCUMENTO (pilha), não por arquivo: uma pilha entra se o
// seu topo passar nos critérios. As revisões anteriores vão junto,
// acessíveis ao expandir — independentemente da visão escolhida.
function getFiltered() {
  const pilhas = montarPilhas(DOCS);

  return pilhas.filter(p => {
    const d = p.topo;
    // "Arquivado" = nenhuma cópia do documento está vigente
    const arquivado = p.arquivos.every(a => !a.vigente);
    if (S.visao === 'vigentes' && arquivado) return false;
    if (S.visao === 'arquivados' && !arquivado) return false;

    if (S.discs.size && !S.discs.has(d.disciplina)) return false;
    if (S.tipos.size && !S.tipos.has((d.tipo||'').toUpperCase())) return false;
    if (S.etapas.size && !S.etapas.has(d.etapa)) return false;
    // A busca olha todas as revisões: procurar "R01" deve achar a pilha
    if (S.busca) {
      const alvo = S.busca.toLowerCase();
      if (!p.arquivos.some(a => a.nome_arquivo.toLowerCase().includes(alvo))) return false;
    }
    if (S.dataDe && (!d.data_upload || dataLocal(d.data_upload) < S.dataDe)) return false;
    if (S.dataAte && (!d.data_upload || dataLocal(d.data_upload) > S.dataAte)) return false;
    return true;
  });
}

function temFiltrosAtivos() {
  return S.discs.size > 0 || S.tipos.size > 0 || S.etapas.size > 0 ||
         S.busca !== '' || S.dataDe !== '' || S.dataAte !== '';
}

function updateClearBtn() {
  const btn = document.getElementById('clear-filtros');
  if (btn) btn.style.display = temFiltrosAtivos() ? 'inline-block' : 'none';
}

// Abre ou fecha todos os grupos de uma vez
function alternarTodosGrupos() {
  const discs = [...new Set(getFiltered().map(p => p.topo.disciplina).filter(Boolean))];
  const todosAbertos = discs.length > 0 && discs.every(d => GRUPOS_ABERTOS.has(d));
  GRUPOS_ABERTOS = new Set(todosAbertos ? [] : discs);
  renderDocs();
}

function atualizarBotaoGrupos() {
  const btn = document.getElementById('btn-grupos');
  if (!btn) return;
  const discs = [...new Set(getFiltered().map(p => p.topo.disciplina).filter(Boolean))];
  if (!discs.length) { btn.style.display = 'none'; return; }
  btn.style.display = 'inline-block';
  const todosAbertos = discs.every(d => GRUPOS_ABERTOS.has(d));
  btn.textContent = todosAbertos ? '\u25b4 Recolher todos' : '\u25be Expandir todos';
}

function renderDocs() {
  updateClearBtn();
  atualizarBotaoGrupos();
  const tbody = document.getElementById('doc-tbody');
  tbody.innerHTML = '';

  const pilhas = sortDocs(getFiltered());
  const totalDocs = montarPilhas(DOCS).length;

  document.getElementById('main-hdr').textContent =
    pilhas.length === totalDocs ? pilhas.length + ' documentos'
    : pilhas.length + ' de ' + totalDocs + ' documentos';


  if (!pilhas.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 8;
    td.className = 'empty-state';
    td.textContent = 'Nenhum documento para os filtros selecionados.';
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  // Agrupa as pilhas por disciplina
  const grupos = {};
  pilhas.forEach(p => {
    const disc = p.topo.disciplina || '—';
    if (!grupos[disc]) grupos[disc] = [];
    grupos[disc].push(p);
  });

  // Ordem dos grupos: disciplina que postou mais recentemente vem primeiro.
  // Usa a data real de postagem (sem filtro), pra refletir movimentação
  // do projeto e não o recorte atual da tela.
  const ultimaPorDisc = {};
  DOCS.forEach(d => {
    if (!d.disciplina) return;
    if ((d.data_upload || '') > (ultimaPorDisc[d.disciplina] || '')) {
      ultimaPorDisc[d.disciplina] = d.data_upload;
    }
  });
  const ordem = Object.keys(grupos).sort((a, b) =>
    (ultimaPorDisc[b] || '').localeCompare(ultimaPorDisc[a] || ''));

  // Busca por texto expande tudo: quem procura quer ver os arquivos
  const expandirTudo = S.busca !== '';

  ordem.forEach(disc => {
    const pilhasGrupo = grupos[disc];
    const aberto = expandirTudo || GRUPOS_ABERTOS.has(disc);

    tbody.appendChild(montarCabecalhoGrupo(disc, pilhasGrupo, aberto));
    if (!aberto) return;

    pilhasGrupo.forEach(p => {
      tbody.appendChild(renderDocRow(p.topo, p));

      // Revisões anteriores, se a pilha estiver aberta
      if (p.revisoes.length && (expandirTudo || PILHAS_ABERTAS.has(p.chave))) {
        p.revisoes.forEach(rev => {
          const tr = renderDocRow(rev, null);
          tr.classList.add('rev-row');
          tbody.appendChild(tr);
        });
      }
    });
  });
}

// O controle "atualizado no servidor" é interno da coordenação —
// projetistas não veem essa parte do cabeçalho.
function podeVerServidor() {
  return USER_PROFILE && (USER_PROFILE.papel === 'admin' || USER_PROFILE.papel === 'coordenador');
}

// O cabeçalho do grupo é também a linha de resumo da disciplina:
// contagem de documentos, última postagem e "atualizado no servidor".
function montarCabecalhoGrupo(disc, pilhasGrupo, aberto) {
  const tr = document.createElement('tr');
  tr.className = 'grupo-row';

  const td = document.createElement('td');
  td.className = 'grupo-td';
  td.colSpan = 8;

  const linha = document.createElement('div');
  linha.className = 'grupo-linha';

  const seta = document.createElement('span');
  seta.className = 'grupo-seta';
  seta.textContent = aberto ? '\u25be' : '\u25b8';
  linha.appendChild(seta);

  // O badge da disciplina abre a pasta dela no Drive
  const linkDisc = (DOCS.find(d => d.disciplina === disc && d.link_pasta_disciplina) || {}).link_pasta_disciplina;
  let tag;
  if (linkDisc) {
    tag = document.createElement('a');
    tag.href = linkDisc;
    tag.target = '_blank';
    tag.rel = 'noopener';
    tag.title = 'Abrir a pasta de ' + disc + ' no Drive';
    tag.style.textDecoration = 'none';
    tag.onclick = (e) => e.stopPropagation();   // não recolhe o grupo
  } else {
    tag = document.createElement('span');
  }
  tag.className = 'd-tag d-' + disc;
  tag.textContent = disc;
  linha.appendChild(tag);

  // Total da disciplina no projeto (em documentos, ignorando filtros)
  const totalDisc = montarPilhas(DOCS.filter(d => d.disciplina === disc)).length;
  const qtd = document.createElement('span');
  qtd.className = 'grupo-qtd';
  qtd.innerHTML = pilhasGrupo.length === totalDisc
    ? '<b>' + totalDisc + '</b> documentos'
    : '<b>' + pilhasGrupo.length + '</b> de ' + totalDisc + ' documentos';
  linha.appendChild(qtd);

  // Última postagem e atividade: estado real da disciplina, sem filtro
  let ultima = '', atividade = 0;
  DOCS.forEach(d => {
    if (d.disciplina !== disc) return;
    if ((d.data_upload || '') > ultima) ultima = d.data_upload;
    const atv = atividadeDoc(d);
    if (atv > atividade) atividade = atv;
  });

  const dt = document.createElement('span');
  dt.className = 'grupo-data';
  if (ultima) {
    const dias = diasDesde(ultima);
    const rel = dias === 0 ? 'hoje' : (dias === 1 ? 'há 1 dia' : 'há ' + dias + ' dias');
    dt.innerHTML = fmtDate(ultima) + ' <span class="grupo-dias">(' + rel + ')</span>';
  } else {
    dt.textContent = '—';
  }
  linha.appendChild(dt);

  // A célula existe sempre (mesmo vazia) pra não desalinhar a grade
  if (podeVerServidor()) {
    linha.appendChild(montarControleServidor(disc, atividade));
  } else {
    linha.appendChild(document.createElement('span'));
  }

  td.appendChild(linha);
  tr.appendChild(td);

  tr.onclick = () => {
    if (GRUPOS_ABERTOS.has(disc)) GRUPOS_ABERTOS.delete(disc);
    else GRUPOS_ABERTOS.add(disc);
    renderDocs();
  };

  return tr;
}

function renderDocRow(d, pilha) {
  const tr = document.createElement('tr');
  tr.className = 'doc-row' + (!d.vigente ? ' nao-vigente' : '');

  // Caminho abre a PASTA no Drive (o nome do arquivo abre o arquivo).
  // Útil quando se quer baixar tudo de uma pasta de uma vez.
  const tdCaminho = document.createElement('td');
  if (d.link_pasta) {
    const a = document.createElement('a');
    a.className = 'doc-pasta-link';
    a.href = d.link_pasta;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = 'Abrir a pasta no Google Drive';
    a.textContent = d.caminho || '(raiz)';
    tdCaminho.appendChild(a);
  } else {
    tdCaminho.innerHTML = '<span class="doc-mono">' + esc(d.caminho || '—') + '</span>';
  }
  tr.appendChild(tdCaminho);

  const tdNome = document.createElement('td');
  const nomeRow = document.createElement('div'); nomeRow.className = 'doc-name-row';
  let nomeEl;
  if (d.link) {
    nomeEl = document.createElement('a');
    nomeEl.href = d.link; nomeEl.target = '_blank'; nomeEl.rel = 'noopener';
    nomeEl.className = 'doc-name doc-name-link';
  } else {
    nomeEl = document.createElement('span');
    nomeEl.className = 'doc-name';
  }
  nomeEl.textContent = d.nome_arquivo;
  if (!pilha) {  // revisão anterior dentro de uma pilha
    const ind = document.createElement('span');
    ind.className = 'rev-indent';
    ind.textContent = '\u21b3';
    nomeRow.appendChild(ind);
  }
  nomeRow.appendChild(nomeEl);
  if (!d.nome_valido) {
    const tag = document.createElement('span'); tag.className = 'doc-tag doc-tag-invalido'; tag.textContent = 'fora do padrão';
    nomeRow.appendChild(tag);
  }
  if (!d.vigente) {
    const tag = document.createElement('span'); tag.className = 'doc-tag doc-tag-naovigente'; tag.textContent = 'não vigente';
    nomeRow.appendChild(tag);
  }
  if (d.vigente && ehRecente(d.data_upload)) {
    const tag = document.createElement('span');
    tag.className = 'tag-novo';
    tag.textContent = 'novo';
    tag.title = 'Enviado nos últimos ' + DIAS_RECENTE + ' dias';
    nomeRow.appendChild(tag);
  }
  tdNome.appendChild(nomeRow);
  tr.appendChild(tdNome);

  const tdEtapa = document.createElement('td');
  tdEtapa.innerHTML = '<span class="doc-mono">' + esc(d.etapa || '—') + '</span>';
  tr.appendChild(tdEtapa);

  const tdRev = document.createElement('td');
  const revSpan = document.createElement('span');
  revSpan.className = 'doc-mono';
  revSpan.textContent = d.revisao || '—';
  tdRev.appendChild(revSpan);
  // Indicador de histórico: só no topo da pilha, quando há revisões anteriores
  if (pilha && pilha.revisoes.length) {
    const aberta = PILHAS_ABERTAS.has(pilha.chave);
    const badge = document.createElement('span');
    badge.className = 'rev-badge';
    badge.textContent = (aberta ? '\u25be ' : '+') + pilha.revisoes.length +
                        (aberta ? '' : (pilha.revisoes.length === 1 ? ' rev.' : ' revs.'));
    badge.title = aberta ? 'Ocultar revisões anteriores' : 'Ver revisões anteriores';
    badge.onclick = (e) => {
      e.stopPropagation();
      if (aberta) PILHAS_ABERTAS.delete(pilha.chave);
      else PILHAS_ABERTAS.add(pilha.chave);
      renderDocs();
    };
    tdRev.appendChild(badge);
  }
  tr.appendChild(tdRev);

  const tdTipo = document.createElement('td');
  const tipo = (d.tipo || '').toLowerCase();
  tdTipo.innerHTML = tipo
    ? '<span class="doc-tipo f-' + esc(tipo) + '">' + esc(tipo) + '</span>'
    : '<span class="doc-mono">—</span>';
  tr.appendChild(tdTipo);

  const tdTam = document.createElement('td');
  tdTam.innerHTML = '<span class="doc-tamanho">' + fmtTamanho(d.tamanho_mb) + '</span>';
  tr.appendChild(tdTam);

  const tdUpload = document.createElement('td');
  tdUpload.innerHTML = '<span class="doc-mono">' + fmtDate(d.data_upload) + '</span>';
  tr.appendChild(tdUpload);

  const tdData = document.createElement('td');
  tdData.innerHTML = '<span class="doc-mono">' + fmtDate(d.data_modificacao) + '</span>';
  tr.appendChild(tdData);

  return tr;
}

// ── UTILS ──
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function diasDesde(iso){
  // Diferença em dias de calendário (local), não em blocos de 24h —
  // algo postado ontem à noite conta como "há 1 dia" mesmo que
  // tenham se passado só 10 horas.
  const d = new Date(iso);
  const hoje = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  return Math.round((b - a) / 86400000);
}
function dataLocal(iso){
  // Converte um timestamp pra data local (YYYY-MM-DD), evitando o
  // deslize de fuso horário do UTC perto da meia-noite.
  if(!iso) return '';
  const d = new Date(iso);
  const p = n => ('0'+n).slice(-2);
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
// Um arquivo é "novo" se chegou nos últimos dias — ajuda a identificar
// rapidamente o que foi postado desde a última visita.
const DIAS_RECENTE = 7;
function ehRecente(iso){
  if (!iso) return false;
  return diasDesde(iso) <= DIAS_RECENTE;
}

function fmtTamanho(mb){
  if (mb == null || isNaN(mb)) return '—';
  const n = parseFloat(mb);
  if (n < 0.1) return '<0,1 MB';
  return n.toFixed(1).replace('.', ',') + ' MB';
}

function fmtDate(s){
  if(!s)return'';
  const d=new Date(s);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); doLogin(); });

(async () => {
  show('loading');
  setLoadingText('Restaurando sessão…');
  const restored = await tryRestoreSession();
  if (restored) {
    await loadApp();
  } else {
    show('login');
  }
})();
</script>
