<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Página Inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="sidebar.css?v=6">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="stylesheet" href="login.css?v=3">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F8F8;--surface:#FFF;--surface2:#F6F5F3;--surface3:#E5E4E1;
  --border:#E5E4E1;--border2:#CCC8C4;
  --text:#191919;--text2:#727272;--text3:#B5B5B5;
  --pend:#7A5200;--resol:#1A6B48;--alert:#C42828;
  --sans:'Manrope',sans-serif;--serif:'IBM Plex Serif',serif;--mono:'IBM Plex Mono',monospace;
}

body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN (idêntico às outras páginas — mesma sessão compartilhada) ── */

/* ── LOADING ── */
#screen-loading{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.loading-logo{height:23px;opacity:0.6}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}

/* ── LAYOUT (sidebar sempre presente — "casca" fixa da página; só o
   conteúdo à direita troca entre login/loading/app) ── */
.app-shell{display:flex;min-height:100vh}
.shell-content{flex:1;min-width:0;display:flex;flex-direction:column}
#screen-app{display:none} /* controlado via JS (show()) */
.page-body{padding:32px 40px 60px;max-width:820px}

/* ── RESUMO DO PROJETO ── */
.proj-hero{margin-bottom:28px}
.proj-hero-foto{aspect-ratio:21/8;background:var(--surface2) center/cover no-repeat;border:1px solid var(--border);margin-bottom:24px}
.proj-hero-code{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px}
.proj-hero-name{font-family:var(--serif);font-size:26px;font-weight:300;color:var(--text);margin-bottom:4px}
.proj-hero-sub{font-family:var(--mono);font-size:11px;color:var(--text2)}
.proj-hero-endereco{font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:2px}
.proj-hero-editar{margin-top:14px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.06em;padding:6px 13px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;display:none}
.proj-hero-editar:hover{border-color:var(--text2);color:var(--text)}
.pmodal{display:none;position:fixed;inset:0;background:rgba(25,25,25,0.45);z-index:2000;align-items:center;justify-content:center;padding:20px}
.pmodal.open{display:flex}
.pmodal-box{background:var(--surface);border:1px solid var(--border);padding:26px 28px;width:min(460px,100%);max-height:90vh;overflow:auto}
.pmodal-title{font-family:var(--serif);font-size:17px;font-weight:300;margin-bottom:18px}
.pfield{margin-bottom:13px}
.pfield label{display:block;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.pfield input,.pfield textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 11px;font-family:var(--sans);font-size:13px;outline:none}
.pfield input:focus,.pfield textarea:focus{border-color:var(--text2)}
.pfield textarea{min-height:90px;resize:vertical;line-height:1.5}
.pfield-ro{opacity:0.55;pointer-events:none}
.pmodal-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.pbtn{font-family:var(--sans);font-size:11px;font-weight:600;padding:8px 16px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
.pbtn:hover{border-color:var(--text2);color:var(--text)}
.pbtn-primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.pbtn-primary:hover{opacity:0.85;color:var(--surface)}
.proj-hero-responsavel{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:8px}

.disc-chips{display:flex;flex-wrap:wrap;gap:6px}
.disc-chip{font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 9px;border:1px solid var(--border2);border-radius:2px;color:var(--text2);background:var(--surface2)}

/* ── BLOCOS (notas, equipe) ── */
.bloco{margin-bottom:24px}
.bloco-label{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.notas-texto{background:var(--surface);border:1px solid var(--border);padding:16px 18px;font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--text2);white-space:pre-wrap}

/* ── PAINEL ── */
.painel-recente{font-family:var(--sans);font-size:12px;color:var(--text2);padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px}
.painel-recente b{color:var(--text);font-weight:600}
.painel-recente a{color:inherit}
.painel-cartoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.painel-cartao{flex:1;min-width:170px;padding:14px 16px;border:1px solid var(--border);background:var(--surface);text-decoration:none;display:block}
.painel-cartao.pendente{border-color:#E4B4B4;background:#FBEFEF}
.painel-num{font-family:var(--serif);font-size:30px;font-weight:300;line-height:1;color:var(--text)}
.painel-cartao.pendente .painel-num{color:var(--alert)}
.painel-rot{font-family:var(--sans);font-size:12px;color:var(--text2);margin-top:3px}
.painel-cartao.pendente .painel-rot{color:var(--alert)}
.painel-nota{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px}
.painel-cartao.pendente .painel-nota{color:var(--alert);opacity:0.8}
/* Saúde do projeto e das disciplinas da pessoa (régua do Monitor) */
.saude{border:1px solid var(--border);background:var(--surface);padding:16px 18px;margin-bottom:12px}
.saude-tit{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.saude-linha{display:flex;gap:28px;flex-wrap:wrap}
.saude-bloco{display:flex;align-items:center;gap:12px}
.saude-rosca text{font-family:var(--sans);font-size:15px;font-weight:600;fill:var(--text)}
.saude-rot{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.saude-num{font-family:var(--mono);font-size:10px;color:var(--text2);line-height:1.6}
.saude-crit{color:var(--alert)}
.painel-alerta{color:#A35A00}

/* ── EQUIPE ── */
.equipe-sinal{display:block;width:7px;height:7px;border-radius:50%}
.equipe-num{font-family:var(--sans);font-size:13px;color:var(--text3)}
.equipe-num.deve{color:var(--alert);font-weight:600}
.equipe-quando{font-family:var(--mono);font-size:10.5px;color:var(--text3)}
.equipe-quando.tarde{color:var(--alert)}
.d-tag .pend{color:var(--alert);font-weight:700}
.d-tag{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap}
.equipe-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
.equipe-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
.equipe-table tr:last-child td{border-bottom:none}
.equipe-nome{font-weight:600;display:flex;align-items:center;gap:8px}
.equipe-email{display:block;font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px;text-decoration:none}
.equipe-email:hover{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.papel-badge.p-coordenador{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;background:#E4F2EE;color:var(--resol)}
.equipe-vazio{background:var(--surface);border:1px solid var(--border);padding:16px 18px;font-family:var(--mono);font-size:11px;color:var(--text3)}

/* ── MOBILE ── */
@media (max-width: 720px) {
  .page-body{padding:20px 16px 40px}
  .proj-hero-name{font-size:20px}
}
</style>
</head>
<body data-page="inicio">

<div class="app-shell">
  <div id="ospa-sidebar"></div>
  <div class="shell-content">

<!-- LOGIN -->
<div id="screen-login"></div>

<!-- LOADING -->
<div id="screen-loading">
  <img id="loading-logo" class="loading-logo" alt="OSPA">
  <div class="loading-text" id="loading-text" data-t="g.carregando"></div>
</div>

<!-- APP -->
<div id="screen-app">
  <div class="page-body">
      <div class="proj-hero-foto" id="hero-foto" hidden></div>
      <div class="proj-hero">
        <div class="proj-hero-code" id="hero-code">—</div>
        <div class="proj-hero-name" id="hero-name">—</div>
        <div class="proj-hero-sub" id="hero-sub"></div>
        <div class="proj-hero-endereco" id="hero-endereco"></div>
        <div class="proj-hero-responsavel" id="hero-responsavel"></div>

      </div>



      <!-- Painel: o que esta pessoa precisa fazer -->
      <div id="painel" style="display:none"></div>

      <!-- Notas: só aparece se houver conteúdo (editado nas Configurações) -->
      <div class="bloco" id="bloco-notas" style="display:none">
        <div class="bloco-label" data-t="home.notas_label"></div>
        <div class="notas-texto" id="notas-texto"></div>
      </div>

      <div class="bloco">
        <div class="bloco-label" data-t="home.equipe_label"></div>
        <div id="equipe-wrap"></div>
      </div>
  </div>
</div>

  </div>
</div>

<script src="idioma.js?v=8"></script>
<script src="sidebar.js?v=13"></script>
<script src="editor-launcher.js?v=5"></script>
<script src="auth.js?v=5"></script>
<script src="dados.js?v=1"></script>
<script src="login.js?v=4"></script>
<script src="disciplinas.js?v=1"></script>
<script>
// Sessão (SB_URL, SB_KEY, SB_AUTH, SESSION, SESSION_KEY, saveSession,
// loadSavedSession, clearSavedSession, refreshSession, tryRestoreSession
// e sbFetch) vive em auth.js — compartilhado por todas as páginas.

// Alimenta o sidebar com o código do projeto assim que possível — antes de
// qualquer autenticação — pra ele já nascer certo na primeira renderização
// (feita pelo próprio sidebar.js no DOMContentLoaded), sem esperar o login.
document.body.dataset.projeto = new URLSearchParams(window.location.search).get('id') || '';
let USER_PROFILE = null;
let PROJETO = null;
let FOTO = null;
let COORDENADOR_NOME = '';
let DISCIPLINAS = [];
let EQUIPE = [];

setLogos(OSPA_LOGO);

function doLogout() {
  SESSION = null; USER_PROFILE = null;
  PAINEL = null; EQUIPE_PAINEL = []; EQUIPE = []; AP_RESUMO = null; FICHAS_SAUDE = [];
  clearSavedSession();
  show('login');
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').textContent = 'Entrar';
}

// Contrato usado pelo sidebar.js: o link "Sair" do menu chama window.ospaLogout()
window.ospaLogout = doLogout;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── LOAD APP ──
async function loadApp() {
  show('loading');
  setLoadingText(t('g.identificando'));

  const params = new URLSearchParams(window.location.search);
  const projId = params.get('id');

  if (!projId) {
    setLoadingText(t('g.sem_projeto'));
    return;
  }

  try {
    // Mesma verificação de permissão das outras páginas: admin vê tudo,
    // outros usuários precisam ter vínculo com este projeto específico.
    const uid = SESSION.user.id;
    const meArr = await api('GET','usuarios',null,'id=eq.'+uid);
    if (!meArr || !meArr.length) {
      setLoadingText(t('g.sem_cadastro'));
      return;
    }
    const me = meArr[0];

    // O idioma da pessoa entra ANTES de qualquer render: a tela nasce no
    // idioma certo, sem recarregar nem piscar em português.
    ospaIdiomaDaSessao(me.idioma);

    if (me.papel_global === 'admin') {
      USER_PROFILE = { id: uid, email: me.email, nome: me.nome, papel: 'admin', disciplinas: [] };
    } else {
      const perfis = await api('GET','projeto_usuarios_v2',null,
        'usuario_id=eq.'+uid+'&projeto_id=eq.'+projId);
      if (!perfis || !perfis.length) {
        setLoadingText(t('g.sem_acesso'));
        return;
      }
      USER_PROFILE = {
        id: uid, email: me.email, nome: me.nome,
        papel: perfis[0].papel, disciplinas: perfis[0].disciplinas || []
      };
    }

    setLoadingText(t('home.carregando_projeto'));

    const [proj, cfg, acessos, foto] = await Promise.all([
      api('GET','projetos',null,'id=eq.'+projId).then(r=>r[0]),
      api('GET','config_projeto',null,'projeto_id=eq.'+projId).then(r=>r[0]||{}),
      api('GET','projeto_usuarios_v2',null,'projeto_id=eq.'+projId+'&order=papel.asc'),
      // Foto do projeto (Configurações → Dados gerais); sem ela, nada aparece
      api('GET','projeto_fotos',null,'projeto_id=eq.'+projId+'&select=dados')
        .then(r => (r && r[0]) ? r[0].dados : null).catch(() => null),
    ]);

    PROJETO = proj;
    FOTO = foto;
    DISCIPLINAS = cfg.disciplinas || [];

    // Equipe do projeto: cruza projeto_usuarios_v2 (papel/disciplinas) com
    // usuarios (nome/email). Uma consulta só, com todos os ids de uma vez.
    EQUIPE = [];
    COORDENADOR_NOME = '';
    if (acessos && acessos.length) {
      const ids = acessos.map(a => a.usuario_id);
      const [usuarios, empresas] = await Promise.all([
        api('GET','usuarios',null,'id=in.('+ids.join(',')+')'),
        api('GET','empresas',null,'select=id,nome').catch(() => [])
      ]);
      const porId = {};
      usuarios.forEach(u => { porId[u.id] = u; });
      const empresaPorId = {};
      (empresas || []).forEach(e => { empresaPorId[e.id] = e.nome; });

      EQUIPE = acessos.map(a => {
        const u = porId[a.usuario_id] || {};
        return {
          id: a.usuario_id,          // usado para cruzar com o painel de pendências
          nome: u.nome || '(sem nome)',
          email: u.email || '',
          empresa: empresaPorId[u.empresa_id] || '',
          papel: a.papel || 'projetista',
          disciplinas: a.disciplinas || []
        };
      }).sort((a, b) => {
        // Quem coordena primeiro, depois ordem alfabética
        const ordem = p => OSPA_PAPEIS_COORDENACAO.includes(p) ? 0 : 1;
        const d = ordem(a.papel) - ordem(b.papel);
        return d !== 0 ? d : a.nome.localeCompare(b.nome, 'pt-BR');
      });

      COORDENADOR_NOME = EQUIPE
        .filter(p => OSPA_PAPEIS_COORDENACAO.includes(p.papel))
        .map(p => p.nome)
        .join(', ');
    }

    renderSidebar();
    // Trocar de usuário na mesma aba recarrega os dados, mas as variáveis
    // da sessão anterior continuariam em memória. Limpar aqui evita que a
    // tabela encontre dados de quem saiu.
    PAINEL = null; EQUIPE_PAINEL = []; AP_RESUMO = null; FICHAS_SAUDE = [];

    // Painel: pendências desta pessoa (e da equipe, para a coordenação)
    PAINEL = await rpc('painel_pessoal', { p_projeto: projId }).then(r => (r && r[0]) || null).catch(() => null);
    // Apontamentos esperando esta pessoa. O catch cobre o banco ainda sem a
    // fase 10 aplicada: o painel simplesmente não mostra o cartão.
    AP_RESUMO = await rpc('ap_meu_resumo', { p_projeto: projId }).then(r => (r && r[0]) || null).catch(() => null);
    // Saúde: fichas publicadas (as que o projetista vê), como no Monitor de Conflitos
    FICHAS_SAUDE = await api('GET', 'conflitos', null,
      'projeto_id=eq.' + encodeURIComponent(projId) + '&publicado=not.is.false&select=status,disciplinas,alerta')
      .catch(() => []);
    if (USER_PROFILE && ospaPode(USER_PROFILE.papel, 'ver_equipe')) {
      EQUIPE_PAINEL = await rpc('painel_equipe', { p_projeto: projId }).catch(() => []);
    }

    await ospaCarregarCores(projId);   // cores das disciplinas
    renderPage();
    renderPainel();
    show('app');

  } catch(e) {
    setLoadingText(t('g.erro', { msg: e.message }));
    console.error(e);
  }
}

// Sidebar compartilhado (sidebar.js): alimenta via data-* e re-renderiza
function renderSidebar() {
  document.body.dataset.userName = USER_PROFILE.nome || '';
  document.body.dataset.userRole = USER_PROFILE.papel || 'projetista';
  document.body.dataset.projeto = PROJETO.id || '';
  // Tipo do projeto: decide quais abas a sidebar mostra (um acompanhamento
  // não tem a parte de conflitos). Na ausência, compatibilização.
  document.body.dataset.projetoTipo = (PROJETO && PROJETO.tipo) || 'compatibilizacao';
  document.body.dataset.userDisciplinas = (USER_PROFILE.disciplinas || []).join(',');
  if (typeof ospaRenderSidebar === 'function') ospaRenderSidebar();
}

// ── PAINEL ──
// O que esta pessoa precisa fazer, e o que chegou nos últimos 7 dias.
// Sai todo de consultas sobre dados que já existem — nenhuma tabela
// nova, nenhum estado a manter em dia.

let PAINEL = null, EQUIPE_PAINEL = [], AP_RESUMO = null;
let FICHAS_SAUDE = [];   // status, disciplinas e alerta das fichas publicadas

// ── SAÚDE ──
// Mesma régua do Monitor de Conflitos (analytics.html): porcentagem de
// fichas resolvidas; vermelho abaixo de 40%, âmbar até 70%, verde acima.
function corSaude(pct) { return pct < 40 ? '#C42828' : pct < 70 ? '#B8860B' : '#1A6B48'; }

function roscaSaude(pct, cor) {
  const tam = 76, esp = 7, r = (tam - esp) / 2, c = 2 * Math.PI * r;
  return '<svg class="saude-rosca" width="' + tam + '" height="' + tam + '" viewBox="0 0 ' + tam + ' ' + tam + '">' +
    '<circle cx="' + tam / 2 + '" cy="' + tam / 2 + '" r="' + r + '" stroke-width="' + esp + '" fill="none" stroke="var(--border)"></circle>' +
    '<circle cx="' + tam / 2 + '" cy="' + tam / 2 + '" r="' + r + '" stroke-width="' + esp + '" fill="none" stroke="' + cor + '"' +
    ' stroke-dasharray="' + c + '" stroke-dashoffset="' + (c - pct / 100 * c) + '" stroke-linecap="butt"' +
    ' transform="rotate(-90 ' + tam / 2 + ' ' + tam / 2 + ')"></circle>' +
    '<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle">' + pct + '%</text></svg>';
}

// Um bloco: rosca + rótulo + "x/y resolvidas · n em aberto · c críticos"
function blocoSaude(rotuloHtml, fichas) {
  const total = fichas.length;
  if (!total) return '';
  const resolvidas = fichas.filter(f => f.status === 'RESOLVIDO').length;
  const abertas = total - resolvidas;
  const criticos = fichas.filter(f => f.alerta && f.status !== 'RESOLVIDO').length;
  const pct = Math.round(resolvidas / total * 100);
  return '<div class="saude-bloco">' + roscaSaude(pct, corSaude(pct)) +
    '<div class="saude-txt"><div class="saude-rot">' + rotuloHtml + '</div>' +
    '<div class="saude-num">' + t('home.saude_resolvidas', { r: resolvidas, n: total }) + '</div>' +
    '<div class="saude-num">' + tn('home.saude_abertas', abertas) +
      (criticos ? ' · <span class="saude-crit">' + tn('home.criticos_n', criticos) + '</span>' : '') + '</div>' +
    '</div></div>';
}

// Projeto inteiro e, para quem responde por disciplinas, cada uma delas
function htmlSaude() {
  const fichas = FICHAS_SAUDE || [];
  if (!fichas.length) return '';
  let h = blocoSaude(t('home.saude_projeto'), fichas);
  const minhas = (USER_PROFILE && USER_PROFILE.disciplinas) || [];
  minhas.slice(0, 4).forEach(sig => {
    h += blocoSaude(t('home.saude_disciplina') + ' <span class="d-tag d-' + esc(sig) + '">' + esc(sig) + '</span>',
                    fichas.filter(f => (f.disciplinas || []).includes(sig)));
  });
  return '<div class="saude"><div class="saude-tit">' + t('home.saude_titulo') + '</div>' +
         '<div class="saude-linha">' + h + '</div></div>';
}

function relatorioComDiscs(discs) {
  // leva ao relatório já filtrado pelas disciplinas da pessoa
  const q = (discs && discs.length) ? '&disc=' + encodeURIComponent(discs.join(',')) : '';
  return 'projeto.html?id=' + encodeURIComponent(PROJETO.id) + q;
}

function apontamentosUrl() {
  return 'apontamentos.html?id=' + encodeURIComponent(PROJETO.id);
}

// O cartão dos apontamentos dirigidos a esta pessoa. Fica junto das
// pendências de ficha de propósito: um canal que só existe na sua
// própria tela ninguém olha, e aí deixa de servir para qualquer coisa.
function cartaoApontamentos() {
  const r = AP_RESUMO;
  if (!r) return '';
  const paraMim = Number(r.para_mim || 0);
  const semResp = Number(r.para_mim_sem_resposta || 0);
  const atrasados = Number(r.atrasados || 0);   // fase 15: prazo vencido
  if (!paraMim && !atrasados) return '';
  // Nada dirigido a você, mas algo atrasado (por exemplo, um que você abriu):
  // o cartão conta os atrasados, em vez de mostrar "0 dirigidos".
  if (!paraMim) {
    return '<a class="painel-cartao pendente" href="' + apontamentosUrl() + '">' +
      '<div class="painel-num">' + atrasados + '</div>' +
      '<div class="painel-rot">' + tn('home.ap_atrasados_rot', atrasados) + '</div></a>';
  }
  return '<a class="painel-cartao' + (semResp || atrasados ? ' pendente' : '') + '" href="' + apontamentosUrl() + '">' +
    '<div class="painel-num">' + paraMim + '</div>' +
    '<div class="painel-rot">' + tn('home.ap_dirigidos', paraMim) + '</div>' +
    (semResp ? '<div class="painel-nota painel-alerta">' +
               t('home.ap_sem_resposta', { n: semResp }) + '</div>' : '') +
    (atrasados ? '<div class="painel-nota painel-alerta">' +
                 t('home.ap_atrasados', { n: atrasados }) + '</div>' : '') +
    '</a>';
}

function renderPainel() {
  const el = document.getElementById('painel');
  if (!PAINEL) { el.style.display = 'none'; return; }

  // Num projeto de acompanhamento não existem fichas de conflito: mostrar
  // "0 conflitos abertos" seria ruído.
  const temConflitos = ((PROJETO && PROJETO.tipo) || 'compatibilizacao') === 'compatibilizacao';

  const p = PAINEL;
  const discs = p.disciplinas || [];
  const recente = [];
  // "<b>3</b> fichas novas": o número em negrito vai dentro da própria
  // tradução, porque a ordem das palavras muda de idioma.
  const emNegrito = (chave, n) => tn(chave, n, { n: '<b>' + n + '</b>' });
  if (temConflitos && p.fichas_recentes) recente.push(emNegrito('home.fichas_novas', p.fichas_recentes));
  if (p.arquivos_recentes)    recente.push(emNegrito('home.arquivos', p.arquivos_recentes));
  if (p.comentarios_recentes) recente.push(emNegrito('home.comentarios', p.comentarios_recentes));
  if (AP_RESUMO && Number(AP_RESUMO.recentes || 0)) {
    recente.push(emNegrito('home.apontamentos', Number(AP_RESUMO.recentes)));
  }

  let h = '';
  if (recente.length) {
    h += '<div class="painel-recente">' + t('home.recente', { itens: recente.join(' · ') }) + '</div>';
  }

  h += '<div class="painel-cartoes">';
  h += cartaoApontamentos();
  if (!temConflitos) {
    h += '</div>';
    el.innerHTML = h;
    el.style.display = (recente.length || AP_RESUMO && Number(AP_RESUMO.para_mim || 0)) ? 'block' : 'none';
    return;
  }
  if (p.sem_resposta > 0) {
    h += '<a class="painel-cartao pendente" href="' + relatorioComDiscs(discs) + '">' +
         '<div class="painel-num">' + p.sem_resposta + '</div>' +
         '<div class="painel-rot">' + tn('home.aguardando', p.sem_resposta) + '</div>' +
         (p.mais_antiga_dias ? '<div class="painel-nota">' + t('home.mais_antiga', { n: p.mais_antiga_dias }) + '</div>' : '') +
         '</a>';
  }
  // Conflitos em aberto: a saúde já mostra em aberto e críticos de cada
  // disciplina, então o cartão só aparece quando não há saúde para mostrar.
  const saude = htmlSaude();
  if (!saude) {
    h += '<a class="painel-cartao" href="' + relatorioComDiscs(discs) + '">' +
         '<div class="painel-num">' + p.abertos + '</div>' +
         '<div class="painel-rot">' + tn('home.abertos', p.abertos) +
         (discs.length && discs.length <= 4 ? t('home.abertos_em', { discs: discs.join(', ') }) : '') + '</div>' +
         (p.criticos ? '<div class="painel-nota painel-alerta">' + p.criticos + ' ' +
                       tn('home.criticos', p.criticos) + '</div>' : '') +
         '</a>';
  }
  h += '</div>';

  el.innerHTML = saude + h;
  el.style.display = 'block';
}

// Sinal que resume a linha da pessoa na tabela da equipe
function sinalEquipe(m) {
  if (!m.ultimo_acesso || m.mais_antiga_dias > 7) return ['var(--alert)', t('home.critico')];
  if (m.devendo > 0) return ['#A35A00', t('home.atencao')];
  return ['var(--resol)', t('home.em_dia')];
}

function quandoAcesso(iso) {
  return iso ? tQuando(iso) : t('g.nunca');
}

function renderPage() {
  const heroFoto = document.getElementById('hero-foto');
  heroFoto.hidden = !FOTO;
  heroFoto.style.backgroundImage = FOTO ? 'url(' + FOTO + ')' : '';
  document.getElementById('hero-code').textContent = PROJETO.id || '';
  document.getElementById('hero-name').textContent = PROJETO.nome || '';
  document.getElementById('hero-sub').textContent = PROJETO.cliente || '';
  document.getElementById('hero-endereco').textContent = PROJETO.endereco || '';
  document.getElementById('hero-responsavel').textContent =
    PROJETO.responsavel ? t('home.responsavel', { nome: PROJETO.responsavel }) : '';

  // Notas — bloco só existe se houver conteúdo (evita caixa vazia na tela)
  const notas = (PROJETO.notas || '').trim();
  const blocoNotas = document.getElementById('bloco-notas');
  if (notas) {
    document.getElementById('notas-texto').textContent = notas;
    blocoNotas.style.display = '';
  } else {
    blocoNotas.style.display = 'none';
  }

  renderEquipe();
}

function renderEquipe() {
  const wrap = document.getElementById('equipe-wrap');

  if (!EQUIPE.length) {
    wrap.innerHTML = '<div class="equipe-vazio">' + t('home.equipe_vazia') + '</div>';
    return;
  }

  // Para a coordenação, a mesma tabela ganha três colunas e um sinal
  // que resume a linha. Para os demais, segue como era.
  // Duas condições, não uma: o papel de quem está olhando E a presença
  // dos dados. Assim, mesmo que a consulta retornasse algo por engano,
  // a tela não mostra pendências nem acessos a quem não coordena.
  const podeVerEquipe = !!USER_PROFILE && ospaPode(USER_PROFILE.papel, 'ver_equipe');
  const comPainel = podeVerEquipe && EQUIPE_PAINEL.length > 0;
  const porId = {};
  EQUIPE_PAINEL.forEach(m => { porId[m.usuario_id] = m; });

  const linhas = EQUIPE.map(p => {
    const m = porId[p.id] || null;
    const pend = (m && m.pendencias) || {};

    // crachás com a cor das Configurações; o número é o que falta responder
    const discs = p.disciplinas.length
      ? '<div class="disc-chips">' + p.disciplinas.map(d =>
          '<span class="d-tag d-'+esc(d)+'">'+esc(d)+
          (pend[d] ? ' <span class="pend">'+pend[d]+'</span>' : '')+'</span>').join(' ') + '</div>'
      : '<span style="color:var(--text3)">—</span>';
    const coordBadge = OSPA_PAPEIS_COORDENACAO.includes(p.papel)
      ? ' <span class="papel-badge p-coordenador">' + esc(ospaRotuloPapel(p.papel)) + '</span>' : '';
    // (o rótulo do papel vem traduzido do sidebar.js)

    let extras = '';
    let sinal = '';
    if (comPainel && m) {
      const [cor, titulo] = sinalEquipe(m);
      sinal = '<td style="width:8px;padding-right:0"><span class="equipe-sinal" title="'+titulo+'" style="background:'+cor+'"></span></td>';
      const tarde = m.mais_antiga_dias > 7;
      extras =
        '<td><span class="equipe-num'+(m.devendo ? ' deve' : '')+'">'+(m.devendo || '—')+'</span></td>' +
        '<td><span class="equipe-quando'+(tarde ? ' tarde' : '')+'">'+(m.mais_antiga_dias ? 'há '+m.mais_antiga_dias+' dias' : '—')+'</span></td>' +
        '<td><span class="equipe-quando'+(!m.ultimo_acesso ? ' tarde' : '')+'">'+quandoAcesso(m.ultimo_acesso)+'</span></td>';
    } else if (comPainel) {
      sinal = '<td style="width:8px;padding-right:0"></td>';
      extras = '<td>—</td><td>—</td><td>—</td>';
    }

    return '<tr>' + sinal +
      '<td><div class="equipe-nome">'+esc(p.nome)+coordBadge+'</div>' +
        (p.email ? '<a class="equipe-email" href="mailto:'+encodeURIComponent(p.email).replace(/%40/g,'@')+'" title="'+esc(t('home.escrever_para'))+'">'+esc(p.email)+'</a>' : '') + '</td>' +
      '<td>'+(p.empresa ? esc(p.empresa) : '<span style="color:var(--text3)">—</span>')+'</td>' +
      '<td>'+discs+'</td>' + extras +
    '</tr>';
  }).join('');

  const cabecalho = comPainel
    ? '<thead><tr>' + ['', t('home.col_pessoa'), t('home.col_empresa'), t('home.col_disc'),
                        t('home.col_devendo'), t('home.col_antiga'), t('home.col_acesso')]
        .map(h => '<th style="text-align:left;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);padding:8px 14px">'+h+'</th>').join('') +
      '</tr></thead>'
    : '';

  wrap.innerHTML =
    '<table class="equipe-table">' + cabecalho +
      '<tbody>'+linhas+'</tbody>' +
    '</table>';
}

function show(screen) {
  ['login','loading','app'].forEach(s => {
    const el = document.getElementById('screen-'+s);
    if (!el) return;
    if (s !== screen) { el.style.display = 'none'; return; }
    el.style.display = (s === 'app') ? 'block' : 'flex';
  });
  const sb = document.getElementById('ospa-sidebar');
  if (sb) sb.style.display = (screen === 'login') ? 'none' : '';
}

(async () => {
  show('loading');
  setLoadingText(t('g.restaurando'));
  const restored = await tryRestoreSession();
  if (restored) {
    await loadApp();
  } else {
    show('login');
  }
})();
</script>
</body>
</html>
