<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Compatibilização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8F8F8;--surface:#FFF;--surface2:#F6F5F3;--surface3:#E5E4E1;--border:#E5E4E1;--border2:#CCC8C4;--text:#191919;--text2:#727272;--text3:#B5B5B5;--pend:#7A5200;--resol:#1A6B48;--alert:#C42828;--sans:'Manrope',sans-serif;--serif:'IBM Plex Serif',serif;--mono:'IBM Plex Mono',monospace;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
#screen-loading{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.loading-logo{height:40px;opacity:0.7}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}
#screen-projects{display:none;flex-direction:column;align-items:center;padding:60px 40px}
.proj-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:960px;margin-bottom:48px}
.proj-logo{height:36px}
.proj-title{font-family:var(--serif);font-size:14px;font-weight:300;color:var(--text2);letter-spacing:0.08em}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border);width:100%;max-width:960px}
.proj-card{background:var(--surface);padding:22px 24px;position:relative}
.proj-card-code{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:7px}
.proj-card-name{font-family:var(--serif);font-size:19px;font-weight:300;color:var(--text);margin-bottom:3px}
.proj-card-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:14px}
.proj-card-stats{display:flex;gap:20px;padding-top:12px;border-top:1px solid var(--border)}
.proj-stat{font-family:var(--mono);font-size:10px;color:var(--text3)}
.proj-stat b{color:var(--text);font-weight:600}
.proj-stat.pend b{color:var(--pend)}.proj-stat.resol b{color:var(--resol)}
.proj-card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.proj-card-actions-secondary{margin-top:6px}
.proj-action{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:0.03em;padding:6px 12px;border:1px solid var(--border2);color:var(--text2);background:transparent;text-decoration:none;cursor:pointer;transition:all 0.1s;display:inline-block}
.proj-action:hover{border-color:var(--text2);color:var(--text)}
.proj-action-editor{border-color:var(--text);color:var(--text)}
.proj-action-editor:hover{background:var(--text);color:var(--surface)}
.proj-card-bkp{position:absolute;top:10px;right:36px;background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;opacity:0;transition:opacity 0.1s;padding:4px 6px}
.proj-card:hover .proj-card-bkp{opacity:1}
.proj-card-bkp:hover{color:var(--text)}
.proj-card-del{position:absolute;top:10px;right:12px;background:none;border:none;font-size:15px;color:var(--text3);cursor:pointer;opacity:0;transition:opacity 0.1s;padding:4px 6px}
.proj-card:hover .proj-card-del{opacity:1}
.proj-card-del:hover{color:var(--alert)}
.proj-new{background:transparent;border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;min-height:120px;cursor:pointer;color:var(--text3);font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.1s}
.proj-new:hover{border-color:var(--text2);color:var(--text2);background:var(--surface)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(25,25,25,0.45);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);padding:32px;width:min(520px,92vw);border:1px solid var(--border);max-height:90vh;overflow-y:auto}
.modal-lbl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:18px}
.frow{margin-bottom:12px}
.frow label{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.frow input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 10px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color 0.12s}
.frow input:focus{border-color:var(--text2)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 18px;border:none;cursor:pointer;letter-spacing:0.04em;transition:all 0.1s}
.btn-p{background:var(--text);color:var(--surface)}.btn-p:hover{opacity:0.85}
.btn-g{background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-g:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--alert);color:var(--alert)}.btn-danger:hover{background:var(--alert);color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--surface);font-family:var(--mono);font-size:11px;padding:9px 15px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.backup-list{max-height:300px;overflow-y:auto;margin-bottom:16px}
.backup-item{padding:10px 12px;border:1px solid var(--border);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.backup-type{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.08em}
.backup-meta{font-family:var(--mono);font-size:10px;color:var(--text2);margin-top:2px}
.backup-time{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px}
/* ── LOGIN ── */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;font-family:var(--sans)}
.login-box{background:var(--surface);border:1px solid var(--border);padding:40px;width:min(380px,100%)}
.login-logo{height:32px;margin-bottom:28px;display:block}
.login-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text);margin-bottom:6px}
.login-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px 12px;font-family:var(--sans);font-size:13px;outline:none}
.login-field input:focus{border-color:var(--text2)}
.login-btn{width:100%;background:var(--text);color:var(--surface);border:none;padding:11px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;letter-spacing:0.04em}
.login-btn:hover{opacity:0.85}
.login-err{font-family:var(--mono);font-size:11px;color:var(--alert);margin-top:10px;display:none}
#screen-denied{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px;font-family:var(--sans)}
.denied-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text)}
.denied-text{font-family:var(--mono);font-size:11px;color:var(--text3)}
.logout-corner{position:fixed;top:16px;right:20px;background:none;border:none;font-family:var(--mono);font-size:9px;color:var(--text3);cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;z-index:50}
.logout-corner:hover{color:var(--alert)}

body.restricted-coordinator .proj-new{display:none!important}
body.restricted-coordinator .proj-card-del{display:none!important}
body.restricted-coordinator .proj-card-bkp{display:none!important}
body.restricted-coordinator .proj-header button{display:none!important}
</style>
</head>
<body>
<div id="screen-login">
  <div class="login-box">
    <img id="login-logo" class="login-logo" alt="OSPA">
    <div class="login-title">Editor de Compatibilização</div>
    <div class="login-sub">Acesso restrito</div>
    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="login-email" name="email" placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>
<div id="screen-denied">
  <img id="denied-logo" class="login-logo" alt="OSPA">
  <div class="denied-title">Acesso restrito</div>
  <div class="denied-text">Você não tem permissão de edição em nenhum projeto.</div>
  <button class="login-btn" style="width:auto;padding:8px 20px" onclick="doLogout()">Sair</button>
</div>
<button class="logout-corner" id="logout-corner" style="display:none" onclick="doLogout()">Sair</button>
<div id="screen-loading">
  <img id="loading-logo" class="loading-logo" alt="OSPA">
  <div class="loading-text">Carregando…</div>
</div>
<div id="screen-projects">
  <div class="proj-header">
    <img id="projects-logo" class="proj-logo" alt="OSPA">
    <div class="proj-title">Relatórios de Compatibilização</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-g" onclick="openBackups()" style="font-size:11px">↺ Backups</button>
      <button class="btn btn-g" onclick="openModal()">+ Novo projeto</button>
    </div>
  </div>
  <div class="proj-grid" id="proj-grid"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-lbl">Novo Projeto</div>
    <div class="frow"><label>Código</label><input id="np-id" placeholder="ex: SJD_COMPAT" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="frow"><label>Empreendimento</label><input id="np-nome" placeholder="ex: Silva Jardim"></div>
    <div class="frow"><label>Cliente</label><input id="np-cliente"></div>
    <div class="frow"><label>Responsável</label><input id="np-resp"></div>
    <div class="modal-btns">
      <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-p" onclick="createProject()">Criar projeto</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-backups">
  <div class="modal">
    <div class="modal-lbl">Backups</div>
    <div class="backup-list" id="backup-list"></div>
    <div class="modal-btns">
      <button class="btn btn-g" onclick="document.getElementById('modal-backups').classList.remove('open')">Fechar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="auth.js?v=2"></script>

const SITE   = "https://eduardoriemke.github.io/ospa-compat";
const HDR    = {"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};
const HDR_R  = {...HDR,"Prefer":"return=representation"};


document.getElementById("loading-logo").src = LOGO;
document.getElementById("projects-logo").src = LOGO;
document.getElementById("login-logo").src = LOGO;
document.getElementById("denied-logo").src = LOGO;


async function api(method,table,body,qs){
  var url=SB_URL+"/rest/v1/"+table+(qs?"?"+qs:"");
  var r;
  try{r=await fetch(url,{method:method,headers:method==="GET"?HDR:HDR_R,body:body?JSON.stringify(body):undefined});}
  catch(e){throw new Error("Falha de rede: "+e.message);}
  if(!r.ok){var m;try{m=(await r.json()).message;}catch(_){m="HTTP "+r.status;}throw new Error(m);}
  return method==="DELETE"?null:r.json();
}

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  setTimeout(function(){el.classList.remove("show");},2500);
}

// Backup manual acionado pelo botão do card. Diferente do automático,
// aqui o usuário precisa saber se deu certo ou não.
async function backupManual(pid,nome){
  if(!confirm("Criar um backup de \""+nome+"\"?\n\nInclui dados do projeto, conflitos e imagens.")) return;
  toast("Criando backup…");
  var r=await createBackup(pid,"manual","Backup manual de "+nome);
  if(r.ok){
    toast("Backup criado ("+r.tamanho+" MB · "+r.conflitos+" conflitos · "+r.imagens+" imagens).");
  }else{
    alert("Não foi possível criar o backup.\n\nMotivo: "+r.erro+
          "\n\nSe a mensagem indicar tamanho ou limite, o projeto tem imagens demais para um único backup — me avise para ajustarmos o método.");
  }
}

async function createBackup(pid,tipo,desc){
  try{
    var data=await Promise.all([
      api("GET","projetos",null,"id=eq."+pid).then(function(r){return r[0];}),
      api("GET","config_projeto",null,"projeto_id=eq."+pid).then(function(r){return r[0]||{};}),
      api("GET","conflitos",null,"projeto_id=eq."+pid+"&order=ordem.asc"),
      api("GET","imagens",null,"projeto_id=eq."+pid+"&select=conflito_id,ordem,dados"),
    ]);
    var payload={projeto:data[0],config:data[1],conflitos:data[2],imagens:data[3]};
    var tamMB=(JSON.stringify(payload).length/1048576).toFixed(1);
    await api("POST","backups",{projeto_id:pid,tipo:tipo,descricao:desc||"",dados:payload});
    return {ok:true,tamanho:tamMB,imagens:(data[3]||[]).length,conflitos:(data[2]||[]).length};
  }catch(e){console.error("Backup error:",e);return {ok:false,erro:e.message};}
}

async function loadProjects(){
  var lt=document.querySelector(".loading-text");
  try{
    lt.textContent="Conectando…";
    var proj=await api("GET","projetos",null,"order=created_at.asc");
    PROJETOS = proj;
    if (MY_PROJECT_IDS !== null) {
      proj = proj.filter(p => MY_PROJECT_IDS.includes(p.id));
    }
    renderProjects(proj);
    document.getElementById("screen-loading").style.display="none";
    document.getElementById("screen-projects").style.display="flex";
  }catch(e){
    lt.textContent="✗ "+e.message;
    lt.style.color="#C42828";
  }
}

function renderProjects(projetos,todos){
  var grid=document.getElementById("proj-grid");
  grid.innerHTML="";
  projetos.forEach(function(p){
    var card=document.createElement("div");
    card.className="proj-card";
    card.innerHTML=
      "<div class=\"proj-card-code\">"+p.id+"</div>"+
      "<div class=\"proj-card-name\">"+p.nome+"</div>"+
      "<div class=\"proj-card-sub\">"+(p.cliente||"")+"</div>"+
      "<button class=\"proj-card-bkp\" title=\"Criar backup\">↺</button>"+
      "<button class=\"proj-card-del\" title=\"Excluir\">×</button>";
    (function(pid,pnome){
      card.onclick=function(){ window.location.href="home.html?id="+encodeURIComponent(pid); };
      card.querySelector(".proj-card-del").onclick=function(e){e.stopPropagation();deleteProject(pid,pnome);};
      card.querySelector(".proj-card-bkp").onclick=function(e){e.stopPropagation();backupManual(pid,pnome);};
    })(p.id,p.nome);
    grid.appendChild(card);
  });
  // O botão "+ Novo projeto" do cabeçalho já cobre esta ação —
  // o card duplicado foi removido para não repetir o mesmo comando.
}

async function deleteProject(id,nome){
  if(!confirm("Excluir o projeto \""+nome+"\"?\n\nUm backup será criado automaticamente.")) return;
  toast("Criando backup…");
  var rb=await createBackup(id,"exclusao_projeto","Antes de excluir "+nome);
  if(!rb.ok && !confirm("⚠️ O backup automático FALHOU.\n\nMotivo: "+rb.erro+"\n\nExcluir mesmo assim? Os dados não poderão ser recuperados.")) return;
  try{
    await api("DELETE","projetos",null,"id=eq."+id);
    toast("Projeto excluído. Backup salvo.");
    loadProjects();
  }catch(e){alert("Erro ao excluir: "+e.message);}
}

async function openBackups(){
  document.getElementById("modal-backups").classList.add("open");
  var list=document.getElementById("backup-list");
  list.innerHTML="<div style=\"font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px\">Carregando…</div>";
  try{
    // select explícito: sem isso o navegador baixaria o conteúdo completo de
    // cada backup (todas as imagens em base64) só para montar a lista.
    var bkps=await api("GET","backups",null,"select=id,projeto_id,tipo,descricao,created_at&order=created_at.desc&limit=20");
    if(!bkps.length){list.innerHTML="<div style=\"font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px\">Nenhum backup encontrado.</div>";return;}
    list.innerHTML="";
    bkps.forEach(function(b){
      var d=new Date(b.created_at);
      var ts=d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      var item=document.createElement("div");item.className="backup-item";
      var info=document.createElement("div");
      // Nome do projeto quando ele ainda existe; senão fica só o código
      var pj=(PROJETOS||[]).find(function(p){return p.id===b.projeto_id;});
      var titulo=(pj?pj.nome:b.projeto_id);
      var sub=(pj?b.projeto_id:"projeto excluído")+(b.descricao?" · "+b.descricao:"");
      info.innerHTML="<div class=\"backup-type\">"+titulo+"</div><div class=\"backup-meta\">"+sub+"</div><div class=\"backup-time\">"+b.tipo.replace(/_/g," ")+" · "+ts+"</div>";
      var btn=document.createElement("button");
      btn.className="btn btn-g";btn.style.cssText="font-size:10px;padding:5px 10px;flex-shrink:0";
      btn.textContent="Restaurar";
      (function(bid,pid){btn.onclick=function(){restoreBackup(bid,pid);};})(b.id,b.projeto_id);
      item.appendChild(info);item.appendChild(btn);list.appendChild(item);
    });
  }catch(e){list.innerHTML="<div style=\"color:var(--alert);font-family:var(--mono);font-size:11px;padding:8px\">Erro: "+e.message+"</div>";}
}

async function restoreBackup(backupId,projetoId){
  if(!confirm("Restaurar este backup?\n\nOs dados atuais serão substituídos. Um backup do estado atual será criado primeiro.")) return;
  toast("Restaurando…");
  try{
    await createBackup(projetoId,"restauracao","Antes de restaurar");
    var b=await api("GET","backups",null,"id=eq."+backupId).then(function(r){return r[0];});
    var d=b.dados;
    await api("DELETE","conflitos",null,"projeto_id=eq."+projetoId);
    await api("PATCH","projetos",{nome:d.projeto.nome,endereco:d.projeto.endereco,cliente:d.projeto.cliente,responsavel:d.projeto.responsavel,revisao:d.projeto.revisao,data:d.projeto.data,notas:d.projeto.notas},"id=eq."+projetoId);
    for(var i=0;i<d.conflitos.length;i++){
      var c=d.conflitos[i];
      var nc=await api("POST","conflitos",{projeto_id:projetoId,codigo:c.codigo,alerta:c.alerta,status:c.status,local:c.local,disciplinas:c.disciplinas,descricao:c.descricao,proposta:c.proposta,observacao:c.observacao,ordem:i});
      var cImgs=d.imagens.filter(function(img){return img.conflito_id===c.id;});
      for(var j=0;j<cImgs.length;j++){
        await api("POST","imagens",{conflito_id:nc[0].id,projeto_id:projetoId,ordem:cImgs[j].ordem,dados:cImgs[j].dados});
      }
    }
    document.getElementById("modal-backups").classList.remove("open");
    toast("Backup restaurado!");
    loadProjects();
  }catch(e){alert("Erro ao restaurar: "+e.message);}
}


function openModal(){document.getElementById("modal").classList.add("open");}
function closeModal(){document.getElementById("modal").classList.remove("open");}

async function createProject(){
  var id=document.getElementById("np-id").value.trim();
  var nome=document.getElementById("np-nome").value.trim();
  var cliente=document.getElementById("np-cliente").value.trim();
  var resp=document.getElementById("np-resp").value.trim();
  if(!id||!nome){alert("Código e nome são obrigatórios.");return;}
  try{
    await api("POST","projetos",{id:id,nome:nome,cliente:cliente,responsavel:resp,revisao:"REV. 00"});
    await api("POST","config_projeto",{projeto_id:id,disciplinas:["ARQ","HID","EST","INT","CLI","ELE","GAS","PSG","IMP","MOD"],locais:["SS2","SS1","TER","2PV","TIP","14PV","RFTP","COB","RES"]});
    closeModal();toast("Projeto criado!");loadProjects();
  }catch(e){alert("Erro: "+e.message);}
}

// ── AUTH ──
let ME = null;
let MY_PROJECT_IDS = null; // null = admin (all projects), array = restricted list
let PROJECT_ROLES = null;
let PROJETOS = [];  // lista carregada, usada também para nomear os backups  // null = admin (Editor em tudo), objeto { projeto_id: 'coordenador'|'projetista' }

async function apiAuth(method, table, body, qs) {
  const url = '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await sbFetch(url, {
    method,
    headers: method !== 'GET' ? {'Prefer':'return=representation'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.message || 'HTTP '+r.status); }
  return method === 'DELETE' ? null : r.json();
}
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-err');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent = 'Preencha email e senha.'; err.style.display = 'block'; return; }
  document.getElementById('login-btn').textContent = 'Entrando…';
  try {
    const r = await fetch(SB_AUTH + '/token?grant_type=password', {
      method: 'POST',
      headers: {'Content-Type':'application/json','apikey':SB_KEY},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas');
    SESSION = data;
    saveSession(SESSION);
    await afterLogin();
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
    document.getElementById('login-btn').textContent = 'Entrar';
  }
}

function doLogout() {
  SESSION = null; ME = null; MY_PROJECT_IDS = null; PROJECT_ROLES = null;
  clearSavedSession();
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-projects').style.display = 'none';
  document.getElementById('screen-denied').style.display = 'none';
  document.getElementById('logout-corner').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').textContent = 'Entrar';
}

async function afterLogin() {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-loading').style.display = 'flex';
  const lt = document.querySelector('#screen-loading .loading-text');
  lt.textContent = 'Verificando permissões…';
  try {
    const uid = SESSION.user.id;
    const meArr = await apiAuth('GET','usuarios',null,'id=eq.'+uid);
    if (!meArr.length) { showDenied(); return; }
    ME = meArr[0];

    if (ME.papel_global === 'admin') {
      MY_PROJECT_IDS = null; // sees everything
      PROJECT_ROLES = null;
    } else {
      const access = await apiAuth('GET','projeto_usuarios_v2',null,'usuario_id=eq.'+uid);
      if (!access.length) { showDenied(); return; }
      MY_PROJECT_IDS = access.map(a => a.projeto_id);
      PROJECT_ROLES = {};
      access.forEach(a => { PROJECT_ROLES[a.projeto_id] = a.papel; });
    }

    document.getElementById('logout-corner').style.display = 'block';
    if (MY_PROJECT_IDS !== null) {
      document.body.classList.add('restricted-coordinator');
    }
    await loadProjects();
    if (MY_PROJECT_IDS !== null) {
      // Defensive: hide creation/deletion controls for restricted coordinators
      document.querySelectorAll('.proj-header button, .proj-new, .proj-card-del').forEach(el => el.style.display = 'none');
    }
  } catch(e) {
    lt.textContent = 'Erro: ' + e.message;
  }
}

function showDenied() {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-denied').style.display = 'flex';
}

document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); doLogin(); });

(async () => {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-loading').style.display = 'flex';
  const lt = document.querySelector('#screen-loading .loading-text');
  lt.textContent = 'Restaurando sessão…';
  const restored = await tryRestoreSession();
  if (restored) {
    await afterLogin();
  } else {
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-login').style.display = 'flex';
  }
})();
</script>
