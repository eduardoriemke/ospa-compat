<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Compatibilização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=1">
<link rel="stylesheet" href="login.css?v=3">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8F8F8;--surface:#FFF;--surface2:#F6F5F3;--surface3:#E5E4E1;--border:#E5E4E1;--border2:#CCC8C4;--text:#191919;--text2:#727272;--text3:#B5B5B5;--pend:#7A5200;--resol:#1A6B48;--alert:#C42828;--sans:'Manrope',sans-serif;--serif:'IBM Plex Serif',serif;--mono:'IBM Plex Mono',monospace;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
#screen-loading{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.loading-logo{height:25px;opacity:0.7}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}
/* Lista de projetos — composição da Plataforma de briefing, em fundo claro:
   textos empilhados à esquerda, cartões com foto e texto por cima. */
#screen-projects{display:none;justify-content:center;padding:56px 32px 40px}
.proj-wrap{width:100%;max-width:960px}
.proj-logo{height:23px;display:block;margin-bottom:40px}
.proj-eyebrow{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.proj-titulo{font-family:var(--sans);font-size:28px;font-weight:700;letter-spacing:-0.01em;color:var(--text);margin-bottom:28px}
.proj-busca{display:flex;align-items:center;gap:12px;margin:-8px 0 20px}
.proj-busca[hidden],.proj-vazio[hidden]{display:none}
.proj-busca input{width:min(320px,100%);background:var(--surface);border:1px solid var(--border2);border-radius:999px;padding:9px 16px;font-family:var(--sans);font-size:13px;color:var(--text);outline:none}
.proj-busca input:focus{border-color:var(--text2)}
.proj-busca span{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--text3)}
.proj-vazio{font-family:var(--sans);font-size:13px;color:var(--text3);padding:24px 0}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.proj-card{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;cursor:pointer;background:#2B2D30;transition:transform .2s,box-shadow .2s}
.proj-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(25,25,25,.16)}
/* Sem foto: fundo escuro neutro com a marca apagada */
.proj-card-foto{position:absolute;inset:0;background:center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.proj-card-foto-marca{height:20px;opacity:.18;filter:invert(1);margin-bottom:22%}
.proj-card-foto.tem-foto .proj-card-foto-marca{display:none}
.proj-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(15,15,15,.82) 0%,rgba(15,15,15,.35) 42%,rgba(15,15,15,0) 70%)}
.proj-card-info{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff}
.proj-card-code{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:3px}
.proj-card-name{font-family:var(--sans);font-size:17px;font-weight:700;line-height:1.2;color:#fff}
.proj-card-sub{font-family:var(--sans);font-size:11px;color:rgba(255,255,255,.7);margin-top:3px}
/* Rodapé: quem está logado à esquerda, ações à direita */
.proj-rodape{display:flex;align-items:center;gap:20px;border-top:1px solid var(--border);margin-top:36px;padding-top:16px;font-family:var(--sans);font-size:12px;color:var(--text3)}
.proj-rodape-acoes{margin-left:auto;display:flex;gap:20px;align-items:center}
.proj-rodape-acoes a,.proj-rodape-acoes button{background:none;border:0;padding:0;font:inherit;color:var(--text2);text-decoration:none;cursor:pointer}
.proj-rodape-acoes a:hover,.proj-rodape-acoes button:hover{color:var(--text)}
.proj-rodape-acoes [hidden]{display:none}
@media (max-width:640px){#screen-projects{padding:40px 20px 32px}.proj-grid{grid-template-columns:1fr 1fr;gap:10px}.proj-rodape{flex-wrap:wrap}}
.proj-card-stats{display:flex;gap:20px;padding-top:12px;border-top:1px solid var(--border)}
.proj-stat{font-family:var(--mono);font-size:10px;color:var(--text3)}
.proj-stat b{color:var(--text);font-weight:600}
.proj-stat.pend b{color:var(--pend)}.proj-stat.resol b{color:var(--resol)}
.proj-card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.proj-card-actions-secondary{margin-top:6px}
.proj-action{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:0.03em;padding:6px 12px;border:1px solid var(--border2);color:var(--text2);background:transparent;text-decoration:none;cursor:pointer;transition:all 0.1s;display:inline-block}
.proj-action:hover{border-color:var(--text2);color:var(--text)}
.proj-action-editor{border-color:var(--text);color:var(--text)}
.proj-action-editor:hover{background:var(--text);color:var(--surface)}
/* Backup e excluir: aparecem ao passar o mouse, no canto do cartão */
.proj-card-bkp,.proj-card-del{position:absolute;top:10px;z-index:2;width:26px;height:26px;border:0;border-radius:50%;background:rgba(15,15,15,.45);color:#fff;font-size:13px;line-height:26px;text-align:center;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.proj-card-bkp{right:42px}
.proj-card-del{right:10px;font-size:15px}
.proj-card:hover .proj-card-bkp,.proj-card:hover .proj-card-del{opacity:1}
.proj-card-bkp:hover{background:rgba(15,15,15,.75)}
.proj-card-del:hover{background:var(--alert)}
/* "+ Novo projeto" é o último cartão (só admin) */
.proj-new{aspect-ratio:4/3;border:1px dashed var(--border2);border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--text2);font-family:var(--sans);font-size:13px;font-weight:600;transition:border-color .15s,color .15s,background .15s}
.proj-new:hover{border-color:var(--text2);color:var(--text);background:var(--surface)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(25,25,25,0.45);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);padding:32px;width:min(520px,92vw);border:1px solid var(--border);max-height:90vh;overflow-y:auto}
.modal-lbl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:18px}
.frow{margin-bottom:12px}
.frow label{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.frow input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 10px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color 0.12s}
.frow input:focus{border-color:var(--text2)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 18px;border:none;cursor:pointer;letter-spacing:0.04em;transition:all 0.1s}
.btn-p{background:var(--text);color:var(--surface)}.btn-p:hover{opacity:0.85}
.btn-g{background:transparent;border:1px solid var(--border2);color:var(--text2)}.btn-g:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--alert);color:var(--alert)}.btn-danger:hover{background:var(--alert);color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--surface);font-family:var(--mono);font-size:11px;padding:9px 15px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.backup-list{max-height:300px;overflow-y:auto;margin-bottom:16px}
.backup-item{padding:10px 12px;border:1px solid var(--border);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.backup-type{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.08em}
.backup-meta{font-family:var(--mono);font-size:10px;color:var(--text2);margin-top:2px}
.backup-time{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px}
/* ── LOGIN ── */
#screen-denied{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px;font-family:var(--sans)}
.denied-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text)}
.denied-text{font-family:var(--mono);font-size:11px;color:var(--text3)}
body.restricted-coordinator .proj-new{display:none!important}
body.restricted-coordinator .proj-card-del{display:none!important}
body.restricted-coordinator .proj-card-bkp{display:none!important}
</style>
</head>
<body>
<div id="screen-login"></div>
<div id="screen-denied">
  <img id="denied-logo" class="login-logo" alt="OSPA">
  <div class="denied-title">Acesso restrito</div>
  <div class="denied-text">Você não tem permissão de edição em nenhum projeto.</div>
  <button class="login-btn" style="width:auto;padding:8px 20px" onclick="doLogout()">Sair</button>
</div>
<div id="screen-loading">
  <img id="loading-logo" class="loading-logo" alt="OSPA">
  <div class="loading-text">Carregando…</div>
</div>
<div id="screen-projects">
  <div class="proj-wrap">
    <img id="projects-logo" class="proj-logo" alt="OSPA">
    <div class="proj-eyebrow" data-t="login.plataforma_txt">Plataforma de compatibilização</div>
    <h1 class="proj-titulo" data-t="projetos.selecione">Selecione um projeto</h1>
    <!-- A busca só aparece quando a lista cresce (ver BUSCA_A_PARTIR_DE) -->
    <div class="proj-busca" id="proj-busca" hidden>
      <input type="search" id="proj-busca-campo" data-t-ph="projetos.buscar" autocomplete="off" oninput="filtrarProjetos()">
      <span id="proj-contagem"></span>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
    <div class="proj-vazio" id="proj-vazio" data-t="projetos.nenhum" hidden></div>
    <div class="proj-rodape">
      <span id="proj-usuario"></span>
      <span class="proj-rodape-acoes">
        <!-- Administração e projetos excluídos: só admin (o banco também confere) -->
        <a id="btn-admin" href="admin.html" data-t="projetos.admin" hidden>Administração</a>
        <button id="btn-backups" onclick="openBackups()" data-t="projetos.excluidos" hidden>Projetos excluídos</button>
        <button id="btn-senha" onclick="ospaTrocarSenha()" data-t="nav.senha">Trocar senha</button>
        <button onclick="doLogout()" data-t="nav.sair">Sair</button>
      </span>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-lbl">Novo Projeto</div>
    <div class="frow"><label>Código</label><input id="np-id" placeholder="ex: SJD_COMPAT" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="frow"><label>Empreendimento</label><input id="np-nome" placeholder="ex: Silva Jardim"></div>
    <div class="frow"><label>Cliente</label><input id="np-cliente"></div>
    <div class="frow"><label>Responsável</label><input id="np-resp"></div>
    <div class="modal-btns">
      <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-p" onclick="createProject()">Criar projeto</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-backups">
  <div class="modal">
    <div class="modal-lbl">Backups</div>
    <div class="backup-list" id="backup-list"></div>
    <div class="modal-btns">
      <button class="btn btn-g" onclick="document.getElementById('modal-backups').classList.remove('open')">Fechar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  setTimeout(function(){el.classList.remove("show");},2500);
}

// Backup manual acionado pelo botão do card. Diferente do automático,
// aqui o usuário precisa saber se deu certo ou não.
async function backupManual(pid,nome){
  if(!confirm("Criar um backup de \""+nome+"\"?\n\nInclui dados do projeto, conflitos e imagens.")) return;
  toast("Criando backup…");
  var r=await createBackup(pid,"manual","Backup manual de "+nome);
  if(r.ok){
    toast("Backup criado.");
    openBackups();
  }else{
    alert("Não foi possível criar o backup.\n\nMotivo: "+r.erro+
          "\n\nSe a mensagem indicar tamanho ou limite, o projeto tem imagens demais para um único backup — me avise para ajustarmos o método.");
  }
}

async function createBackup(pid,tipo,desc){
  try{
    // O backup é montado DENTRO do banco (função backup_projeto no Supabase).
    // Antes, o navegador baixava todas as imagens em base64 e reenviava tudo,
    // o que estourava o tempo limite do Postgres em projetos grandes.
    await api("POST","rpc/bk_criar",{p_projeto:pid,p_desc:desc||""});
    return {ok:true};
  }catch(e){console.error("Backup error:",e);return {ok:false,erro:e.message};}
}

async function loadProjects(){
  var lt=document.querySelector(".loading-text");
  try{
    lt.textContent="Conectando…";
    var proj=await apiTodos('projetos','order=created_at.asc');
    PROJETOS = proj;
    if (MY_PROJECT_IDS !== null) {
      proj = proj.filter(p => MY_PROJECT_IDS.includes(p.id));
    }
    renderProjects(proj);
    document.getElementById("screen-loading").style.display="none";
    document.getElementById("screen-projects").style.display="flex";
  }catch(e){
    lt.textContent="✗ "+e.message;
    lt.style.color="#C42828";
  }
}

function escHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// A busca só aparece a partir deste número de projetos — com poucos, é ruído.
var BUSCA_A_PARTIR_DE = 7;

function renderProjects(projetos,todos){
  var grid=document.getElementById("proj-grid");
  grid.innerHTML="";
  projetos.forEach(function(p){
    var card=document.createElement("div");
    card.className="proj-card";
    // Texto da busca: código, nome, cliente e endereço, sem acento
    card.dataset.busca=semAcento([p.id,p.nome,p.cliente,p.endereco].join(" "));
    card.innerHTML=
      // A foto chega depois (carregarFotos): a lista aparece sem esperar as imagens
      "<div class=\"proj-card-foto\" data-projeto=\""+escHtml(p.id)+"\"><img class=\"proj-card-foto-marca\" src=\""+LOGO+"\" alt=\"\"></div>"+
      "<div class=\"proj-card-info\">"+
        "<div class=\"proj-card-code\">"+escHtml(p.id)+"</div>"+
        "<div class=\"proj-card-name\">"+escHtml(p.nome)+"</div>"+
        (p.cliente ? "<div class=\"proj-card-sub\">"+escHtml(p.cliente)+"</div>" : "")+
      "</div>"+
      "<button class=\"proj-card-bkp\" title=\"Criar backup\">↺</button>"+
      "<button class=\"proj-card-del\" title=\"Excluir\">×</button>";
    (function(pid,pnome){
      card.onclick=function(){ window.location.href="home.html?id="+encodeURIComponent(pid); };
      card.querySelector(".proj-card-del").onclick=function(e){e.stopPropagation();deleteProject(pid,pnome);};
      card.querySelector(".proj-card-bkp").onclick=function(e){e.stopPropagation();backupManual(pid,pnome);};
    })(p.id,p.nome);
    grid.appendChild(card);
  });

  // "+ Novo projeto" volta a ser o último cartão — só para o admin
  if (ME && ME.papel_global === "admin") {
    var novo=document.createElement("button");
    novo.className="proj-new";
    novo.textContent="+ "+t("projetos.novo");
    novo.onclick=openModal;
    grid.appendChild(novo);
  }

  var busca=document.getElementById("proj-busca");
  busca.hidden = projetos.length < BUSCA_A_PARTIR_DE;
  document.getElementById("proj-busca-campo").value="";
  filtrarProjetos();

  carregarFotos(projetos.map(function(p){ return p.id; }));
}

function semAcento(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }

function filtrarProjetos(){
  var termo=semAcento(document.getElementById("proj-busca-campo").value.trim());
  var cards=document.querySelectorAll(".proj-card"), visiveis=0;
  cards.forEach(function(c){
    var ok=!termo || c.dataset.busca.indexOf(termo)!==-1;
    c.style.display=ok?"":"none";
    if(ok) visiveis++;
  });
  // O "+ Novo projeto" some durante a busca, para não parecer resultado
  var novo=document.querySelector(".proj-new");
  if(novo) novo.style.display=termo?"none":"";
  document.getElementById("proj-contagem").textContent=t("projetos.contagem",{n:visiveis});
  document.getElementById("proj-vazio").hidden = !(termo && !visiveis);
}

// Fotos dos projetos (Configurações → Dados gerais). Sem foto, o cartão
// fica com o fundo neutro e a marca apagada.
async function carregarFotos(ids){
  if(!ids.length) return;
  try{
    var lista=ids.map(function(id){ return '"'+String(id).replace(/"/g,'')+'"'; }).join(",");
    var fotos=await api("GET","projeto_fotos",null,"select=projeto_id,dados&projeto_id=in.("+encodeURIComponent(lista)+")");
    (fotos||[]).forEach(function(f){
      var el=document.querySelector('.proj-card-foto[data-projeto="'+f.projeto_id+'"]');
      if(el){ el.style.backgroundImage="url("+f.dados+")"; el.classList.add("tem-foto"); }
    });
  }catch(e){ console.warn("Fotos dos projetos:",e.message); }
}

async function deleteProject(id,nome){
  if(!confirm("Excluir o projeto \""+nome+"\"?\n\nUm backup será criado automaticamente.")) return;
  toast("Criando backup…");
  var rb=await createBackup(id,"exclusao_projeto","Antes de excluir "+nome);
  if(!rb.ok && !confirm("⚠️ O backup automático FALHOU.\n\nMotivo: "+rb.erro+"\n\nExcluir mesmo assim? Os dados não poderão ser recuperados.")) return;
  try{
    await api("POST","rpc/proj_excluir",{p_id:id});
    toast("Projeto excluído. Backup salvo.");
    loadProjects();
  }catch(e){alert("Erro ao excluir: "+e.message);}
}

async function openBackups(){
  document.getElementById("modal-backups").classList.add("open");
  var list=document.getElementById("backup-list");
  list.innerHTML="<div style=\"font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px\">Carregando…</div>";
  try{
    // Lista vem do banco já com o tamanho calculado — sem trazer o
    // conteúdo dos backups (que inclui todas as imagens em base64).
    // Só os backups de projetos que não existem mais: os dos projetos
    // ativos ficam nas Configurações de cada um.
    var bkps=await api("POST","rpc/bk_orfaos",{});
    if(!bkps.length){list.innerHTML="<div style=\"font-family:var(--mono);font-size:11px;color:var(--text3);padding:8px\">Nenhum backup de projeto excluído. Os backups de projetos ativos estão nas Configurações de cada projeto.</div>";return;}
    list.innerHTML="";
    bkps.forEach(function(b){
      var d=new Date(b.created_at);
      var ts=d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      var pj=(PROJETOS||[]).find(function(p){return p.id===b.projeto_id;});
      var titulo=(pj?pj.nome:b.projeto_id);
      var sub=(pj?b.projeto_id:"projeto excluído")+(b.descricao?" · "+b.descricao:"");
      var tam=(b.tamanho_mb!=null? " · "+b.tamanho_mb+" MB" : "");

      var item=document.createElement("div");item.className="backup-item";
      var info=document.createElement("div");
      info.innerHTML="<div class=\"backup-type\">"+titulo+"</div>"+
                     "<div class=\"backup-meta\">"+sub+"</div>"+
                     "<div class=\"backup-time\">"+b.tipo.replace(/_/g," ")+" · "+ts+tam+"</div>";

      var acoes=document.createElement("div");
      acoes.style.cssText="display:flex;gap:6px;flex-shrink:0";

      var btn=document.createElement("button");
      btn.className="btn btn-g";btn.style.cssText="font-size:10px;padding:5px 10px";
      btn.textContent="Restaurar";
      (function(bid,pid){btn.onclick=function(){restoreBackup(bid,pid);};})(b.id,b.projeto_id);

      var del=document.createElement("button");
      del.className="btn btn-g";del.style.cssText="font-size:10px;padding:5px 9px;color:var(--text3)";
      del.textContent="×";del.title="Excluir este backup";
      (function(bid,rot){del.onclick=function(){deleteBackup(bid,rot);};})(b.id,titulo+" · "+ts);

      acoes.appendChild(btn);acoes.appendChild(del);
      item.appendChild(info);item.appendChild(acoes);list.appendChild(item);
    });
  }catch(e){list.innerHTML="<div style=\"color:var(--alert);font-family:var(--mono);font-size:11px;padding:8px\">Erro: "+e.message+"</div>";}
}

async function deleteBackup(id,rotulo){
  if(!confirm("Excluir este backup?\n\n"+rotulo+"\n\nEsta ação não pode ser desfeita.")) return;
  try{
    await api("POST","rpc/bk_orfao_excluir",{p_id:id});
    toast("Backup excluído.");
    openBackups();
  }catch(e){alert("Erro ao excluir: "+e.message);}
}

async function restoreBackup(backupId,projetoId){
  if(!confirm("Restaurar este backup?\n\nOs dados atuais do projeto serão substituídos.\nUm backup do estado atual é criado automaticamente antes.")) return;
  toast("Restaurando…");
  try{
    // Restauração feita DENTRO do banco, em transação única: ou tudo é
    // restaurado, ou nada muda. O método anterior apagava os conflitos
    // e reinseria um a um pelo navegador — se travasse no meio, o
    // projeto ficava pela metade.
    await api("POST","rpc/bk_orfao_restaurar",{p_id:backupId});
    document.getElementById("modal-backups").classList.remove("open");
    toast("Backup restaurado.");
    loadProjects();
  }catch(e){
    alert("Erro ao restaurar: "+e.message+"\n\nNenhuma alteração foi feita — o projeto continua como estava.");
  }
}


function openModal(){document.getElementById("modal").classList.add("open");}
function closeModal(){document.getElementById("modal").classList.remove("open");}

async function createProject(){
  var id=document.getElementById("np-id").value.trim();
  var nome=document.getElementById("np-nome").value.trim();
  var cliente=document.getElementById("np-cliente").value.trim();
  var resp=document.getElementById("np-resp").value.trim();
  if(!id||!nome){alert("Código e nome são obrigatórios.");return;}
  try{
    await api("POST","rpc/proj_criar",{p_id:id,p_nome:nome,p_cliente:cliente,p_responsavel:resp});
    await api("POST","config_projeto",{projeto_id:id,disciplinas:["ARQ","HID","EST","INT","CLI","ELE","GAS","PSG","IMP","MOD"],locais:["SS2","SS1","TER","2PV","TIP","14PV","RFTP","COB","RES"]});
    closeModal();toast("Projeto criado!");loadProjects();
  }catch(e){alert("Erro: "+e.message);}
}

// ── AUTH ──
let ME = null;
let MY_PROJECT_IDS = null; // null = admin (all projects), array = restricted list
let PROJECT_ROLES = null;
let PROJETOS = [];  // lista carregada, usada também para nomear os backups  // null = admin (Editor em tudo), objeto { projeto_id: 'coordenador'|'projetista' }

async function apiAuth(method, table, body, qs) {
  const url = '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await sbFetch(url, {
    method,
    headers: method !== 'GET' ? {'Prefer':'return=representation'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err.message || 'HTTP '+r.status); }
  return method === 'DELETE' ? null : r.json();
}
function doLogout() {
  SESSION = null; ME = null; MY_PROJECT_IDS = null; PROJECT_ROLES = null; PROJETOS = [];
  clearSavedSession();
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-projects').style.display = 'none';
  document.getElementById('screen-denied').style.display = 'none';
  document.getElementById('btn-admin').hidden = true;
  document.getElementById('btn-backups').hidden = true;
  document.body.classList.remove('restricted-coordinator');
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').textContent = 'Entrar';
}

async function afterLogin() {
  // Trocar de usuário na mesma aba não recarrega a página: sem isto,
  // a lista de projetos de quem saiu continuaria em memória.
  PROJETOS = [];
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-loading').style.display = 'flex';
  const lt = document.querySelector('#screen-loading .loading-text');
  lt.textContent = 'Verificando permissões…';
  try {
    const uid = SESSION.user.id;
    const meArr = await apiAuth('GET','usuarios',null,'id=eq.'+uid);
    if (!meArr.length) { showDenied(); return; }
    ME = meArr[0];
    ospaIdiomaDaSessao(ME.idioma);   // vale para a tela de entrada e a troca de senha
    // Criar e excluir projeto, e backups de projetos excluídos, são
    // de administrador — o banco confere, isto só evita botão inútil.
    // ("+ Novo projeto" é desenhado na própria lista, em renderProjects.)
    document.getElementById('btn-admin').hidden = ME.papel_global !== 'admin';
    document.getElementById('btn-backups').hidden = ME.papel_global !== 'admin';
    document.getElementById('proj-usuario').textContent = ME.nome || ME.email || '';

    if (ME.papel_global === 'admin') {
      MY_PROJECT_IDS = null; // sees everything
      PROJECT_ROLES = null;
    } else {
      const access = await apiAuth('GET','projeto_usuarios_v2',null,'usuario_id=eq.'+uid);
      if (!access.length) { showDenied(); return; }
      MY_PROJECT_IDS = access.map(a => a.projeto_id);
      PROJECT_ROLES = {};
      access.forEach(a => { PROJECT_ROLES[a.projeto_id] = a.papel; });
    }

    if (MY_PROJECT_IDS !== null) {
      document.body.classList.add('restricted-coordinator');
    }
    await loadProjects();
    if (MY_PROJECT_IDS !== null) {
      // Defensive: hide creation/deletion controls for restricted coordinators
      document.querySelectorAll('.proj-new, .proj-card-del, .proj-card-bkp').forEach(el => el.style.display = 'none');
    }
  } catch(e) {
    lt.textContent = 'Erro: ' + e.message;
  }
}

function showDenied() {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-denied').style.display = 'flex';
}

(async () => {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-loading').style.display = 'flex';
  const lt = document.querySelector('#screen-loading .loading-text');
  lt.textContent = 'Restaurando sessão…';
  const restored = await tryRestoreSession();
  if (restored) {
    await afterLogin();
  } else {
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-login').style.display = 'flex';
  }
})();
</script>
