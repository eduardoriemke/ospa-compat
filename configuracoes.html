<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Configurações do projeto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="sidebar.css?v=4">
<link rel="stylesheet" href="tokens.css?v=1">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F8F8;--surface:#FFF;--surface2:#F6F5F3;--surface3:#E5E4E1;
  --border:#E5E4E1;--border2:#CCC8C4;
  --text:#191919;--text2:#727272;--text3:#B5B5B5;
  --pend:#7A5200;--resol:#1A6B48;--alert:#C42828;
  --sans:'Manrope',sans-serif;--serif:'IBM Plex Serif',serif;--mono:'IBM Plex Mono',monospace;
}

body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN (idêntico às outras páginas — mesma sessão compartilhada) ── */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);padding:40px;width:min(380px,100%)}
.login-logo{height:32px;margin-bottom:28px;display:block}
.login-title{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--text);margin-bottom:6px}
.login-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:9px 12px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color 0.12s}
.login-field input:focus{border-color:var(--text2)}
.login-btn{width:100%;background:var(--text);color:var(--surface);border:none;padding:11px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity 0.1s;letter-spacing:0.04em}
.login-btn:hover{opacity:0.85}
.login-err{font-family:var(--mono);font-size:11px;color:var(--alert);margin-top:10px;display:none}

/* ── LOADING ── */
#screen-loading{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
.loading-logo{height:36px;opacity:0.6}
.loading-text{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.12em}

/* ── LAYOUT (sidebar sempre presente — "casca" fixa da página; só o
   conteúdo à direita troca entre login/loading/app) ── */
.app-shell{display:flex;min-height:100vh}
.shell-content{flex:1;min-width:0;display:flex;flex-direction:column}
#screen-app{display:none} /* controlado via JS (show()) */
.page-body{padding:32px 40px 60px;max-width:820px}

/* ── RESUMO DO PROJETO ── */
.proj-hero{margin-bottom:28px}
.proj-hero-code{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px}
.proj-hero-name{font-family:var(--serif);font-size:26px;font-weight:300;color:var(--text);margin-bottom:4px}
.proj-hero-sub{font-family:var(--mono);font-size:11px;color:var(--text2)}
.proj-hero-endereco{font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:2px}
.proj-hero-editar{margin-top:14px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.06em;padding:6px 13px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;display:none}
.proj-hero-editar:hover{border-color:var(--text2);color:var(--text)}
.pmodal{display:none;position:fixed;inset:0;background:rgba(25,25,25,0.45);z-index:2000;align-items:center;justify-content:center;padding:20px}
.pmodal.open{display:flex}
.pmodal-box{background:var(--surface);border:1px solid var(--border);padding:26px 28px;width:min(460px,100%);max-height:90vh;overflow:auto}
.pmodal-title{font-family:var(--serif);font-size:17px;font-weight:300;margin-bottom:18px}
.pfield{margin-bottom:13px}
.pfield label{display:block;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.pfield input,.pfield textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 11px;font-family:var(--sans);font-size:13px;outline:none}
.pfield input:focus,.pfield textarea:focus{border-color:var(--text2)}
.pfield textarea{min-height:90px;resize:vertical;line-height:1.5}
.pfield-ro{opacity:0.55;pointer-events:none}
.pmodal-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.pbtn{font-family:var(--sans);font-size:11px;font-weight:600;padding:8px 16px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
.pbtn:hover{border-color:var(--text2);color:var(--text)}
.pbtn-primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.pbtn-primary:hover{opacity:0.85;color:var(--surface)}
.proj-hero-responsavel{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:8px}

.disc-chips{display:flex;flex-wrap:wrap;gap:6px}
.disc-chip{font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 9px;border:1px solid var(--border2);border-radius:2px;color:var(--text2);background:var(--surface2)}

/* ── BLOCOS (notas, equipe) ── */
.bloco{margin-bottom:24px}
.bloco-label{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.notas-texto{background:var(--surface);border:1px solid var(--border);padding:16px 18px;font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--text2);white-space:pre-wrap}

/* ── EQUIPE ── */
.equipe-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
.equipe-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
.equipe-table tr:last-child td{border-bottom:none}
.equipe-nome{font-weight:600;display:flex;align-items:center;gap:8px}
.equipe-email{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px}
.papel-badge.p-coordenador{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;background:#E4F2EE;color:var(--resol)}
.equipe-vazio{background:var(--surface);border:1px solid var(--border);padding:16px 18px;font-family:var(--mono);font-size:11px;color:var(--text3)}

/* ── MOBILE ── */
@media (max-width: 720px) {
  .page-body{padding:20px 16px 40px}
  .proj-hero-name{font-size:20px}
}
</style>
<style>
/* ── CONFIGURAÇÕES DO PROJETO ── */
.cfg-cab{padding:28px 40px 0;border-bottom:1px solid var(--border)}
.cfg-cod{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)}
.cfg-tit{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--text);margin:4px 0 16px}
.cfg-abas{display:flex;gap:2px;flex-wrap:wrap}
.cfg-aba{font-family:var(--sans);font-size:12.5px;padding:9px 14px;border:none;background:transparent;border-bottom:2px solid transparent;color:var(--text2);cursor:pointer}
.cfg-aba.on{color:var(--text);border-bottom-color:var(--acento);font-weight:600}
.cfg-aba.off{color:var(--text3);cursor:default}
.cfg-aba.off span{font-size:9.5px}
.cfg-corpo{padding:22px 40px 60px;max-width:980px}
.cfg-aviso{display:flex;gap:10px;align-items:center;padding:11px 14px;background:var(--acento-fundo);border:1px solid var(--acento-borda);margin-bottom:10px;flex-wrap:wrap}
.cfg-aviso-txt{flex:1;min-width:220px;font-family:var(--sans);font-size:12.5px;color:var(--acento-forte)}
.cfg-barra{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;gap:10px;flex-wrap:wrap}
.cfg-conta{font-family:var(--mono);font-size:10.5px;color:var(--text3)}
.cfg-btn{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:6px 12px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap}
.cfg-btn:hover{border-color:var(--text2);color:var(--text)}
.cfg-btn.pri{background:var(--acento);border-color:var(--acento);color:var(--acento-tinta)}
.cfg-btn.pri:hover{background:var(--acento-forte);color:var(--acento-tinta)}
.cfg-btn.leve{border-color:transparent;background:transparent}
.cfg-btn:disabled{opacity:0.45;cursor:default}
.cfg-tab{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
.cfg-tab th{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
.cfg-tab td{padding:9px 12px;border-bottom:1px solid var(--border);font-family:var(--sans);font-size:12.5px;color:var(--text);vertical-align:middle}
.cfg-tab tr:last-child td{border-bottom:none}
.cfg-badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border:1px solid;white-space:nowrap}
.cfg-pasta{font-family:var(--sans);font-size:12px;color:var(--text2)}
.cfg-pasta.sem{color:var(--text3)}
.cfg-papel{padding:4px 7px;font-family:var(--sans);font-size:12px;border:1px solid var(--border2);background:var(--bg);color:var(--text)}
.cfg-uso{font-family:var(--mono);font-size:10.5px;color:var(--text3);white-space:nowrap}
.cfg-mais{border:none;background:none;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;padding:2px 8px}
.cfg-mais:hover{color:var(--text)}
.cfg-menu{position:fixed;z-index:3000;background:var(--surface);border:1px solid var(--border2);box-shadow:0 6px 18px rgba(0,0,0,0.08);padding:4px;min-width:200px}
.cfg-menu-it{font-family:var(--sans);font-size:12.5px;padding:8px 11px;cursor:pointer;color:var(--text)}
.cfg-menu-it:hover{background:var(--surface2)}
.cfg-menu-it.perigo{color:var(--alert)}
.cfg-menu-it.off{color:var(--text3);cursor:default}
.cfg-menu-it.off:hover{background:none}
.cfg-menu-nota{font-family:var(--mono);font-size:9.5px;color:var(--text3);padding:0 11px 7px;line-height:1.4}
.cfg-sec{margin-top:26px;padding-top:14px;border-top:1px solid var(--border)}
.cfg-sec-tit{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;cursor:pointer;user-select:none}
.cfg-linha-sec{display:flex;align-items:center;gap:10px;padding:7px 0;font-family:var(--sans);font-size:12.5px;color:var(--text2)}
/* pavimentos */
.cfg-pav-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cfg-pav-lista{flex:1;min-width:300px}
.cfg-pav{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--border);background:var(--surface);margin-bottom:5px}
.cfg-pav-setas{display:flex;flex-direction:column;gap:1px}
.cfg-pav-setas button{border:none;background:none;cursor:pointer;color:var(--text3);font-size:9px;line-height:1;padding:1px 3px}
.cfg-pav-setas button:hover{color:var(--text)}
.cfg-pav-setas button:disabled{opacity:0.25;cursor:default}
.cfg-pav-sig{font-family:var(--mono);font-size:12.5px;font-weight:600;width:42px;color:var(--text)}
.cfg-pav-novo{font-family:var(--mono);font-size:9px;padding:1px 6px;border:1px solid var(--acento-borda);color:var(--acento-forte);background:var(--acento-fundo)}
.cfg-terreno{display:flex;align-items:center;gap:8px;margin:4px 0 9px}
.cfg-terreno i{flex:1;border-top:1.5px solid var(--text2)}
.cfg-terreno span{font-family:var(--sans);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3)}
.cfg-ger{width:230px;flex-shrink:0;padding:13px 15px;border:1px dashed var(--border2)}
.cfg-ordem-barra{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--acento-fundo);border:1px solid var(--acento-borda);margin-bottom:12px}
.cfg-add{display:flex;gap:8px;margin-top:12px}
.cfg-add input{font-family:var(--mono);font-size:12px;padding:6px 10px;border:1px solid var(--border2);background:var(--surface);width:90px;text-transform:uppercase;outline:none}
/* paleta de cores */
.cfg-paleta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cfg-cor{width:30px;height:24px;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;font-weight:700}
.cfg-cor.on{outline:2px solid var(--acento);outline-offset:1px}
.cfg-cat{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:2px}
.cfg-cat-it{cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--border);font-family:var(--sans);font-size:12px}
.cfg-cat-it:hover{border-color:var(--text2)}
.cfg-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);font-family:var(--sans);font-size:12px;padding:9px 16px;z-index:4000;display:none}
@media (max-width:760px){.cfg-cab,.cfg-corpo{padding-left:16px;padding-right:16px}}
</style>
</head>

<div class="app-shell">
  <div id="ospa-sidebar"></div>
  <div class="shell-content">

<!-- LOGIN -->
<div id="screen-login">
  <div class="login-box">
    <img id="login-logo" class="login-logo" alt="OSPA">
    <div class="login-title">Página Inicial do Projeto</div>
    <div class="login-sub">Acesso restrito</div>
    <!-- onsubmit inline: garante que um erro de script NUNCA envie o
     formulário pela URL, expondo email e senha no endereço. -->
    <form id="login-form" autocomplete="on" onsubmit="return false" action="javascript:void(0)" method="post">
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="login-email" name="email" placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Entrar</button>
      <div class="login-err" id="login-err"></div>
      <div style="font-family:var(--mono,monospace);font-size:9.5px;line-height:1.5;color:var(--text3,#999);margin-top:14px">Os acessos ao sistema são registrados para fins de coordenação do projeto.</div>
    </form>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading">
  <img id="loading-logo" class="loading-logo" alt="OSPA">
  <div class="loading-text" id="loading-text">Carregando…</div>
</div>

<!-- APP -->
<div id="screen-app">
  <div class="cfg-cab">
    <div class="cfg-cod" id="cfg-cod"></div>
    <div class="cfg-tit">Configurações do projeto</div>
    <div class="cfg-abas" id="cfg-abas"></div>
  </div>
  <div class="cfg-corpo" id="cfg-corpo"></div>
</div>

<!-- janela de edição, reaproveitada pelas operações -->
<div class="pmodal" id="cfg-modal">
  <div class="pmodal-box">
    <div class="pmodal-title"></div>
    <div class="cfg-modal-corpo"></div>
    <div class="pmodal-acoes">
      <button class="pbtn" onclick="fecharModal()">Cancelar</button>
      <button class="pbtn pbtn-primary" id="cfg-modal-ok">Salvar</button>
    </div>
  </div>
</div>
<div class="cfg-toast" id="cfg-toast"></div>

  </div>
</div>

}

// ── SUPABASE HELPERS (idêntico às outras páginas) ──
async function api(method, table, body, qs, customHeaders) {
  const url = '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await sbFetch(url, {
    method,
    headers: customHeaders || (method !== 'GET' ? {'Prefer':'return=representation'} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.message || 'HTTP ' + r.status);
  }
  return (method === 'DELETE' || (customHeaders && customHeaders.Prefer && customHeaders.Prefer.indexOf('return=minimal') >= 0)) ? null : r.json();
}

// ── AUTH (idêntico às outras páginas — mesma chave de sessão) ──
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-err');
  err.style.display = 'none';

  if (!email || !pass) { showLoginErr('Preencha email e senha.'); return; }

  document.getElementById('login-btn').textContent = 'Entrando…';
  try {
    const r = await fetch(SB_AUTH + '/token?grant_type=password', {
      method: 'POST',
      headers: {'Content-Type':'application/json','apikey':SB_KEY},
      body: JSON.stringify({email, password: pass})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas');
    SESSION = data;
    saveSession(SESSION);
    await loadApp();
  } catch(e) {
    showLoginErr(e.message);
    document.getElementById('login-btn').textContent = 'Entrar';
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function doLogout() {
  SESSION = null; USER_PROFILE = null;
  clearSavedSession();
  show('login');
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').textContent = 'Entrar';
}

// Contrato usado pelo sidebar.js: o link "Sair" do menu chama window.ospaLogout()
window.ospaLogout = doLogout;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Chamada às funções do banco. Resposta vazia (funções sem retorno)
// é tratada à parte, para não quebrar ao tentar ler JSON inexistente.
async function rpc(nome, args) {
  const r = await sbFetch('/rest/v1/rpc/' + nome, {
    method: 'POST', body: JSON.stringify(args || {})
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.message || 'HTTP ' + r.status);
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

function toast(msg) {
  const el = document.getElementById('cfg-toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

// Executa uma operação: trava cliques repetidos, recarrega e redesenha
async function operar(fn, sucesso) {
  if (OCUPADO) return;
  OCUPADO = true;
  toast('Salvando…');
  try {
    await fn();
    await carregarTudo();
    render();
    toast(sucesso || 'Salvo.');
  } catch (e) {
    document.getElementById('cfg-toast').style.display = 'none';
    alert(e.message);
  } finally {
    OCUPADO = false;
  }
}

// ── CARREGAMENTO ──
async function loadApp() {
  show('loading');
  setLoadingText('Identificando usuário…');
  const _params = new URLSearchParams(window.location.search);
  PROJ_ID = _params.get('id');
  // ?aba=equipe abre direto na aba (usado pelo atalho do admin)
  const _aba = _params.get('aba');
  if (_aba && ABAS.some(a => a[0] === _aba && a[2])) ABA = _aba;
  if (!PROJ_ID) { setLoadingText('Nenhum projeto especificado. Use ?id=CODIGO na URL.'); return; }

  try {
    const uid = SESSION.user.id;
    const meArr = await api('GET','usuarios',null,'id=eq.'+uid);
    if (!meArr || !meArr.length) { setLoadingText('Usuário não cadastrado no sistema.'); return; }
    const me = meArr[0];

    if (me.papel_global === 'admin') {
      USER_PROFILE = { id: uid, nome: me.nome, email: me.email, papel: 'admin', disciplinas: [] };
    } else {
      const perfis = await api('GET','projeto_usuarios_v2',null,
        'usuario_id=eq.'+uid+'&projeto_id=eq.'+PROJ_ID);
      if (!perfis || !perfis.length) { setLoadingText('Você não tem acesso a este projeto.'); return; }
      USER_PROFILE = { id: uid, nome: me.nome, email: me.email, papel: perfis[0].papel,
                       disciplinas: perfis[0].disciplinas || [] };
    }

    // A configuração é da coordenação (o banco também confere isso)
    if (USER_PROFILE.papel !== 'admin' && USER_PROFILE.papel !== 'coordenador') {
      setLoadingText('As configurações do projeto são acessíveis apenas à coordenação.');
      return;
    }

    setLoadingText('Carregando configurações…');
    await carregarTudo();

    // A sidebar lê nome, papel e disciplinas destas marcações — sem elas,
    // assume "projetista" e esconde os itens da coordenação.
    document.body.dataset.userName = USER_PROFILE.nome || '';
    document.body.dataset.userRole = USER_PROFILE.papel || 'projetista';
    document.body.dataset.projeto = PROJ_ID;
    document.body.dataset.userDisciplinas = (USER_PROFILE.disciplinas || []).join(',');
    if (typeof ospaRenderSidebar === 'function') ospaRenderSidebar();
    render();
    show('app');
  } catch (e) {
    setLoadingText('Erro: ' + e.message);
  }
}

async function carregarTudo() {
  const [proj, disc, uso, pastas, cat, pav, usoPav, membros, candidatos, empresas] = await Promise.all([
    api('GET','projetos',null,'id=eq.'+encodeURIComponent(PROJ_ID)).then(r => r[0]),
    api('GET','disciplinas',null,'projeto_id=eq.'+encodeURIComponent(PROJ_ID)+'&order=sigla.asc'),
    rpc('cfg_uso_disciplinas', { p_projeto: PROJ_ID }),
    rpc('cfg_pastas', { p_projeto: PROJ_ID }),
    api('GET','disciplinas_catalogo',null,'order=sigla.asc'),
    api('GET','pavimentos',null,'projeto_id=eq.'+encodeURIComponent(PROJ_ID)+'&order=ordem.asc'),
    rpc('cfg_uso_pavimentos', { p_projeto: PROJ_ID }),
    rpc('eq_membros',    { p_projeto: PROJ_ID }),
    rpc('eq_candidatos', { p_projeto: PROJ_ID }),
    api('GET','empresas',null,'order=nome.asc')
  ]);
  PROJETO = proj;
  DISC = disc || [];
  USO_DISC = {}; (uso || []).forEach(u => { USO_DISC[u.sigla] = u; });
  PASTAS = pastas || [];
  CATALOGO = cat || [];
  PAV = pav || [];
  USO_PAV = {}; (usoPav || []).forEach(u => { USO_PAV[u.sigla] = u.fichas; });
  MEMBROS = membros || [];
  CANDIDATOS = candidatos || [];
  EMPRESAS = empresas || [];
  ORDEM_EDITADA = null;
}

// ── DESENHO GERAL ──
function render() {
  document.getElementById('cfg-cod').textContent =
    (PROJETO ? PROJETO.nome + ' · ' : '') + PROJ_ID;

  document.getElementById('cfg-abas').innerHTML = ABAS.map(([k, rot, ok]) =>
    '<button class="cfg-aba' + (k === ABA ? ' on' : '') + (ok ? '' : ' off') + '" data-aba="' + k + '">' +
    rot + (ok ? '' : ' <span>· em breve</span>') + '</button>'
  ).join('');
  document.querySelectorAll('.cfg-aba').forEach(b => {
    b.onclick = () => {
      const a = ABAS.find(x => x[0] === b.dataset.aba);
      if (a && a[2]) { ABA = a[0]; render(); }
    };
  });

  const el = document.getElementById('cfg-corpo');
  el.innerHTML = ABA === 'disciplinas' ? htmlDisciplinas()
               : ABA === 'pavimentos'  ? htmlPavimentos()
               : ABA === 'dados'       ? htmlDados()
               : htmlEquipe();
  ligarEventos();
}

// ── DISCIPLINAS ──
function badge(d) {
  const tx = d.cor_texto || '#4A5560', fu = d.cor_fundo || '#EDF0F1', bo = d.cor_borda || '#CDD4D8';
  return '<span class="cfg-badge" style="color:' + tx + ';background:' + fu + ';border-color:' + bo + '">' + esc(d.sigla) + '</span>';
}

function usoTotal(sigla) {
  const u = USO_DISC[sigla];
  return u ? (u.fichas + u.respostas + u.usuarios + u.documentos) : 0;
}

function textoUso(sigla) {
  const u = USO_DISC[sigla];
  if (!u || !usoTotal(sigla)) return 'sem uso';
  const p = [];
  if (u.fichas)     p.push(u.fichas + (u.fichas == 1 ? ' ficha' : ' fichas'));
  if (u.respostas)  p.push(u.respostas + ' resp.');
  if (u.usuarios)   p.push(u.usuarios + (u.usuarios == 1 ? ' pessoa' : ' pessoas'));
  if (u.documentos) p.push(u.documentos + ' docs');
  return p.join(' · ');
}

function htmlDisciplinas() {
  const ativas = DISC.filter(d => d.ativa);
  const inativas = DISC.filter(d => !d.ativa);
  const avulsas = PASTAS.filter(p => !p.disciplina_id && !p.mantida_avulsa);
  const mantidas = PASTAS.filter(p => !p.disciplina_id && p.mantida_avulsa);

  let h = '';

  avulsas.forEach(p => {
    h += '<div class="cfg-aviso">' +
      '<i class="ti ti-folder-question" style="font-size:18px;color:var(--acento)" aria-hidden="true"></i>' +
      '<div class="cfg-aviso-txt"><b>Pasta sem disciplina:</b> "' + esc(p.pasta_nome) + '" · ' +
        p.documentos + (p.documentos == 1 ? ' documento' : ' documentos') +
        ' — aparece em Documentos com o próprio nome</div>' +
      '<button class="cfg-btn" data-associar="' + esc(p.pasta_drive_id) + '">Associar a uma disciplina</button>' +
      '<button class="cfg-btn leve" data-manter="' + esc(p.pasta_drive_id) + '">Manter avulsa</button>' +
    '</div>';
  });

  h += '<div class="cfg-barra">' +
       '<span class="cfg-conta">' + ativas.length + ' disciplinas ativas</span>' +
       '<button class="cfg-btn pri" id="btn-add-disc">+ Adicionar disciplina</button></div>';

  h += '<table class="cfg-tab"><thead><tr><th>Sigla</th><th>Nome</th><th>Pasta no Drive</th>' +
       '<th>Empresa</th><th>Responsáveis</th><th>Em uso</th><th></th></tr></thead><tbody>';
  ativas.forEach(d => {
    const pasta = d.pasta_drive_id
      ? '<span class="cfg-pasta"><i class="ti ti-folder" style="font-size:13px;vertical-align:-2px;color:var(--text3)"></i> ' + esc(d.pasta_nome || '(pasta)') + '</span>'
      : '<span class="cfg-pasta sem">sem pasta própria</span>';
    const emp = EMPRESAS.find(e => e.id === d.empresa_id);
    const resp = responsaveisDe(d.sigla);
    const respTxt = resp.length
      ? esc(resp[0].nome || resp[0].email) + (resp.length > 1 ? ' <span style="color:var(--text3)">+' + (resp.length - 1) + '</span>' : '')
      : '<span style="color:var(--text3)">—</span>';

    h += '<tr><td>' + badge(d) + '</td>' +
         '<td>' + (d.nome ? esc(d.nome) : '<span style="color:var(--text3)">—</span>') + '</td>' +
         '<td>' + pasta + '</td>' +
         '<td>' + (emp ? esc(emp.nome) : '<span style="color:var(--text3)">—</span>') + '</td>' +
         '<td>' + respTxt + '</td>' +
         '<td><span class="cfg-uso">' + textoUso(d.sigla) + '</span></td>' +
         '<td style="text-align:right"><button class="cfg-mais" data-disc="' + d.id + '" aria-label="Ações">⋯</button></td></tr>';
  });
  h += '</tbody></table>';

  if (inativas.length) {
    h += '<div class="cfg-sec"><div class="cfg-sec-tit" id="tg-inativas">' + (VER_INATIVAS ? '▾' : '▸') +
         ' Desativadas (' + inativas.length + ')</div>';
    if (VER_INATIVAS) inativas.forEach(d => {
      h += '<div class="cfg-linha-sec">' + badge(d) + '<span style="flex:1">' + esc(d.nome || '') +
           ' · <span class="cfg-uso">' + textoUso(d.sigla) + '</span></span>' +
           '<button class="cfg-btn" data-reativar="' + d.id + '">Reativar</button></div>';
    });
    h += '</div>';
  }

  if (mantidas.length) {
    h += '<div class="cfg-sec"><div class="cfg-sec-tit" id="tg-mantidas">' + (VER_MANTIDAS ? '▾' : '▸') +
         ' Pastas mantidas avulsas (' + mantidas.length + ')</div>';
    if (VER_MANTIDAS) mantidas.forEach(p => {
      h += '<div class="cfg-linha-sec"><i class="ti ti-folder" style="color:var(--text3)"></i>' +
           '<span style="flex:1">' + esc(p.pasta_nome) + ' · <span class="cfg-uso">' + p.documentos + ' docs</span></span>' +
           '<button class="cfg-btn" data-associar="' + esc(p.pasta_drive_id) + '">Associar</button></div>';
    });
    h += '</div>';
  }
  return h;
}

function menuDisciplina(botao, d) {
  const livre = usoTotal(d.sigla) === 0;
  const itens = [
    ['Editar nome e cor', () => modalEditar(d)],
    ['Trocar pasta', () => modalPasta(d)],
    ['Definir empresa…', () => modalEmpresaDisciplina(d)],
    ['Definir responsáveis…', () => modalResponsaveis(d)],
    ['Renomear sigla…', () => renomearDisciplina(d)],
    ['Mesclar com outra…', null, 'Sob demanda: será feito quando surgir uma disciplina duplicada de verdade.'],
    ['Desativar', () => confirmarDesativar(d), null, 'perigo'],
    ['Excluir', livre ? () => confirmarExcluir(d) : null,
      livre ? null : 'Em uso (' + textoUso(d.sigla) + '). Desative em vez de excluir.', 'perigo']
  ];
  abrirMenu(botao, itens);
}

function renomearDisciplina(d) {
  const nova = (prompt('Nova sigla para ' + d.sigla + ' (2 a 6 letras ou números):', d.sigla) || '').trim().toUpperCase();
  if (!nova || nova === d.sigla) return;
  if (!/^[A-Z0-9]{2,6}$/.test(nova)) { alert('A sigla deve ter de 2 a 6 letras ou números.'); return; }
  const uso = usoTotal(d.sigla)
    ? '\n\nSerá atualizada em todos os registros: ' + textoUso(d.sigla) + ', além de comentários e rodadas.'
    : '';
  if (!confirm('Renomear ' + d.sigla + ' para ' + nova + '?' + uso +
               '\n\nUm backup do projeto é criado antes, automaticamente.' +
               '\n\nOs nomes dos arquivos no Drive não mudam — só o que o sistema registra.')) return;
  operar(() => rpc('cfg_renomear_disciplina', { p_id: d.id, p_nova: nova }),
         d.sigla + ' renomeada para ' + nova + '.');
}

function confirmarDesativar(d) {
  const uso = usoTotal(d.sigla) ? '\n\nEla continua registrada em todas as fichas e respostas atuais (' + textoUso(d.sigla) + ').' : '';
  if (!confirm('Desativar ' + d.sigla + '?\n\nEla deixa de aparecer como opção para fichas novas.' + uso + '\n\nPode ser reativada a qualquer momento.')) return;
  operar(() => rpc('cfg_ativar_disciplina', { p_id: d.id, p_ativa: false }), d.sigla + ' desativada.');
}

function confirmarExcluir(d) {
  if (!confirm('Excluir ' + d.sigla + ' definitivamente?\n\nEla não está em uso em nenhum lugar do projeto.')) return;
  operar(() => rpc('cfg_excluir_disciplina', { p_id: d.id }), d.sigla + ' excluída.');
}

// Quem responde pela disciplina: a mesma informação da Equipe,
// lida pelo outro lado (o vínculo de cada pessoa com o projeto).
function responsaveisDe(sigla) {
  return MEMBROS.filter(m => (m.disciplinas || []).includes(sigla));
}

function modalEmpresaDisciplina(d) {
  const ativas = EMPRESAS.filter(e => e.ativa || e.id === d.empresa_id);
  abrirModal('Empresa responsável por ' + d.sigla,
    '<div class="pfield"><label>Empresa</label>' +
      '<select id="de-emp" style="width:100%;padding:8px;font-family:var(--sans);font-size:13px;border:1px solid var(--border2);background:var(--bg)">' +
      '<option value="">— sem empresa —</option>' +
      ativas.map(e => '<option value="' + e.id + '"' + (e.id === d.empresa_id ? ' selected' : '') + '>' +
                      esc(e.nome) + (e.ativa ? '' : ' (desativada)') + '</option>').join('') +
      '</select></div>' +
    '<button class="cfg-btn" id="de-nova" style="margin-bottom:8px">+ Cadastrar nova empresa</button>' +
    '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.5">' +
    'O cadastro de empresas é global: a mesma empresa serve a todos os projetos.</div>',
    'Salvar', () => {
      operar(() => rpc('disc_empresa', { p_id: d.id, p_empresa: document.getElementById('de-emp').value || null }),
             'Empresa de ' + d.sigla + ' atualizada.');
    });

  document.getElementById('de-nova').onclick = async () => {
    const nome = (prompt('Nome da nova empresa:') || '').trim();
    if (nome.length < 2) return;
    try {
      const id = await rpc('emp_criar', { p_nome: nome });
      await rpc('disc_empresa', { p_id: d.id, p_empresa: id });
      fecharModal();
      await carregarTudo(); render();
      toast('Empresa cadastrada e vinculada a ' + d.sigla + '.');
    } catch (e) { alert(e.message); }
  };
}

function modalResponsaveis(d) {
  if (!MEMBROS.length) {
    abrirModal('Responsáveis por ' + d.sigla,
      '<div style="font-family:var(--sans);font-size:13px;color:var(--text2);line-height:1.6">' +
      'Este projeto ainda não tem equipe. Adicione pessoas na aba <b>Equipe</b> primeiro.</div>', null, null);
    return;
  }
  const escolhidos = new Set(responsaveisDe(d.sigla).map(m => m.usuario_id));
  // quem é da mesma empresa da disciplina aparece primeiro
  const emp = EMPRESAS.find(e => e.id === d.empresa_id);
  const ordenados = MEMBROS.slice().sort((a, b) => {
    const pa = (emp && a.empresa === emp.nome) ? 0 : 1;
    const pb = (emp && b.empresa === emp.nome) ? 0 : 1;
    return pa - pb || (a.nome || '').localeCompare(b.nome || '');
  });

  const corpo = abrirModal('Responsáveis por ' + d.sigla,
    '<div class="pfield"><label>Quem responde</label><div id="dr-lista"></div></div>' +
    '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.5">' +
    'É a mesma informação da aba Equipe: alterar aqui altera lá.</div>',
    'Salvar', () => {
      operar(() => rpc('disc_responsaveis', { p_id: d.id, p_usuarios: [...escolhidos] }),
             'Responsáveis por ' + d.sigla + ' atualizados.');
    });

  const lista = corpo.querySelector('#dr-lista');
  ordenados.forEach(m => {
    const it = document.createElement('div');
    it.className = 'cfg-linha-sec';
    it.style.cursor = 'pointer';
    const marca = document.createElement('input');
    marca.type = 'checkbox'; marca.checked = escolhidos.has(m.usuario_id);
    marca.onclick = (e) => e.stopPropagation();
    marca.onchange = () => { marca.checked ? escolhidos.add(m.usuario_id) : escolhidos.delete(m.usuario_id); };
    it.onclick = () => { marca.checked = !marca.checked; marca.onchange(); };
    it.appendChild(marca);
    it.insertAdjacentHTML('beforeend',
      '<span style="flex:1">' + esc(m.nome || m.email) +
      (m.empresa ? ' <span style="color:var(--text3)">· ' + esc(m.empresa) + '</span>' : '') +
      (emp && m.empresa === emp.nome ? ' <span style="color:var(--acento-forte);font-size:10px">mesma empresa</span>' : '') +
      '</span>');
    lista.appendChild(it);
  });
}

// ── PALETA (cores do catálogo, mais uma neutra) ──
function paleta() {
  const vistas = {}, lista = [];
  CATALOGO.forEach(c => {
    const k = c.cor_texto + c.cor_fundo;
    if (c.cor_texto && !vistas[k]) { vistas[k] = 1; lista.push([c.cor_texto, c.cor_fundo, c.cor_borda]); }
  });
  lista.push(['#4A5560', '#EDF0F1', '#CDD4D8']);
  return lista;
}

function htmlPaleta(atual) {
  return '<div class="cfg-paleta">' + paleta().map((p, i) =>
    '<div class="cfg-cor' + (atual && atual[0] === p[0] && atual[1] === p[1] ? ' on' : '') + '" data-cor="' + i +
    '" style="color:' + p[0] + ';background:' + p[1] + ';border-color:' + p[2] + '">Aa</div>'
  ).join('') + '</div>';
}

function ligarPaleta(box, aoEscolher) {
  const lista = paleta();
  box.querySelectorAll('.cfg-cor').forEach(el => {
    el.onclick = () => {
      box.querySelectorAll('.cfg-cor').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      aoEscolher(lista[+el.dataset.cor]);
    };
  });
}

// ── JANELAS ──
function abrirModal(titulo, corpoHtml, rotuloOk, aoConfirmar) {
  const m = document.getElementById('cfg-modal');
  m.querySelector('.pmodal-title').textContent = titulo;
  m.querySelector('.cfg-modal-corpo').innerHTML = corpoHtml;
  const ok = m.querySelector('#cfg-modal-ok');
  ok.textContent = rotuloOk || 'Salvar';
  ok.style.display = aoConfirmar ? '' : 'none';
  ok.onclick = async () => { if (await aoConfirmar() !== false) fecharModal(); };
  m.classList.add('open');
  return m.querySelector('.cfg-modal-corpo');
}
function fecharModal() { document.getElementById('cfg-modal').classList.remove('open'); }

function modalEditar(d) {
  let cor = [d.cor_texto, d.cor_fundo, d.cor_borda];
  const corpo = abrirModal('Editar ' + d.sigla,
    '<div class="pfield"><label>Nome</label><input id="ed-nome" value="' + esc(d.nome || '') + '"></div>' +
    '<div class="pfield"><label>Cor</label>' + htmlPaleta(cor) + '</div>',
    'Salvar', () => {
      const nome = document.getElementById('ed-nome').value.trim();
      operar(() => rpc('cfg_editar_disciplina', {
        p_id: d.id, p_nome: nome || null,
        p_cor_texto: cor[0], p_cor_fundo: cor[1], p_cor_borda: cor[2]
      }), d.sigla + ' atualizada.');
    });
  ligarPaleta(corpo, c => { cor = c; });
}

function modalPasta(d) {
  // Pastas livres: sem disciplina, ou a atual desta
  const opcoes = PASTAS.filter(p => !p.disciplina_id || p.disciplina_id === d.id);
  const sel = '<select id="ed-pasta" style="width:100%;padding:8px;font-family:var(--sans);font-size:13px;border:1px solid var(--border2);background:var(--bg)">' +
    '<option value="">— sem pasta própria —</option>' +
    opcoes.map(p => '<option value="' + esc(p.pasta_drive_id) + '"' + (p.pasta_drive_id === d.pasta_drive_id ? ' selected' : '') + '>' +
                    esc(p.pasta_nome) + ' (' + p.documentos + ' docs)</option>').join('') +
    '</select>';
  abrirModal('Pasta de ' + d.sigla,
    '<div class="pfield"><label>Pasta no Drive</label>' + sel + '</div>' +
    '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.5">Aparecem as pastas encontradas pela varredura que ainda não pertencem a outra disciplina.</div>',
    'Salvar', () => {
      const v = document.getElementById('ed-pasta').value;
      const p = PASTAS.find(x => x.pasta_drive_id === v);
      operar(() => rpc('cfg_definir_pasta', { p_id: d.id, p_pasta_drive_id: v || null, p_pasta_nome: p ? p.pasta_nome : null }),
             'Pasta de ' + d.sigla + ' atualizada.');
    });
}

function modalAssociar(pastaId) {
  const p = PASTAS.find(x => x.pasta_drive_id === pastaId);
  const alvo = DISC.filter(d => d.ativa);
  const sel = '<select id="as-disc" style="width:100%;padding:8px;font-family:var(--sans);font-size:13px;border:1px solid var(--border2);background:var(--bg)">' +
    alvo.map(d => '<option value="' + d.id + '">' + esc(d.sigla) + (d.nome ? ' — ' + esc(d.nome) : '') +
                  (d.pasta_drive_id ? '  (já tem pasta)' : '') + '</option>').join('') + '</select>';
  abrirModal('Associar "' + (p ? p.pasta_nome : '') + '"',
    '<div class="pfield"><label>Disciplina</label>' + sel + '</div>' +
    '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.5">Se a disciplina já tiver pasta, a associação é substituída por esta. Para uma disciplina nova, crie-a antes em "Adicionar disciplina".</div>',
    'Associar', () => {
      const id = document.getElementById('as-disc').value;
      operar(() => rpc('cfg_definir_pasta', { p_id: id, p_pasta_drive_id: pastaId, p_pasta_nome: p ? p.pasta_nome : null }),
             'Pasta associada.');
    });

function modalAdicionar() {

      }), c.sigla + ' adicionada.');

// ── EQUIPE ──
// Quem participa do projeto, com que papel e por quais disciplinas.
// A relação pessoa ↔ disciplina é a mesma que a tabela de disciplinas
// mostra pelo outro lado: um dado só, editado aqui.

function quando(iso) {
  if (!iso) return '—';
  const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (dias <= 0) return 'hoje';
  if (dias === 1) return 'ontem';
  if (dias < 30) return 'há ' + dias + ' dias';
  return new Date(iso).toLocaleDateString('pt-BR');
}

       ['Pessoa','Empresa','Papel','Disciplinas','Último acesso','Última atividade',''].map(t =>
         '<th>' + t + '</th>').join('') + '</tr></thead><tbody>';

  MEMBROS.forEach(m => {

      '<td>' + (m.empresa ? esc(m.empresa) : '<span style="color:var(--text3)">—</span>') + '</td>' +
      '<td><select class="cfg-papel" data-papel="' + m.usuario_id + '">' +
        ['coordenador','projetista'].map(p =>
          '<option value="' + p + '"' + (m.papel === p ? ' selected' : '') + '>' + p + '</option>').join('') +
      '</select></td>' +
      '<td>' + chips + '</td>' +

// ── PAVIMENTOS ──
// Mostrados de cima para baixo, como num corte
function ordemAtual() {
  if (ORDEM_EDITADA) return ORDEM_EDITADA;
  return PAV.filter(p => p.ativo).sort((a, b) => b.ordem - a.ordem).map(p => p.sigla);
}
function ordemMudou() {
  if (!ORDEM_EDITADA) return false;
  const salva = PAV.filter(p => p.ativo).sort((a, b) => b.ordem - a.ordem).map(p => p.sigla);
  return ORDEM_EDITADA.join() !== salva.join();
}

function htmlPavimentos() {
  const ordem = ordemAtual();
  const porSigla = {}; PAV.forEach(p => { porSigla[p.sigla] = p; });
  const inativos = PAV.filter(p => !p.ativo);

  let lista = '';
  if (ordemMudou()) {
    lista += '<div class="cfg-ordem-barra"><span style="flex:1;font-family:var(--sans);font-size:12.5px;color:var(--acento-forte)">A ordem foi alterada.</span>' +
             '<button class="cfg-btn pri" id="btn-salvar-ordem">Salvar ordem</button>' +
             '<button class="cfg-btn leve" id="btn-desc-ordem">Descartar</button></div>';
  }
  lista += '<div style="font-family:var(--sans);font-size:12px;color:var(--text3);margin-bottom:10px">De cima para baixo, como num corte. Use as setas para reordenar.</div>';

  ordem.forEach((sig, i) => {
    const p = porSigla[sig];
    const novo = p && p.ordem >= 1000 && !ORDEM_EDITADA;
    const f = USO_PAV[sig] || 0;
    lista += '<div class="cfg-pav">' +
      '<div class="cfg-pav-setas">' +
        '<button data-sobe="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Subir">▲</button>' +
        '<button data-desce="' + i + '"' + (i === ordem.length - 1 ? ' disabled' : '') + ' aria-label="Descer">▼</button>' +
      '</div>' +
      '<span class="cfg-pav-sig">' + esc(sig) + '</span>' +
      (novo ? '<span class="cfg-pav-novo">posicione</span>' : '') +
      '<span style="flex:1"></span>' +
      '<span class="cfg-uso">' + (f ? f + (f == 1 ? ' ficha' : ' fichas') : 'sem uso') + '</span>' +
      '<button class="cfg-mais" data-pav="' + esc(sig) + '" aria-label="Ações">⋯</button>' +
    '</div>';
    if (sig === 'TER') {
      lista += '<div class="cfg-terreno"><i></i><span>nível do terreno</span><i style="flex:0 0 24px"></i></div>';
    }
  });

  lista += '<div class="cfg-add"><input id="nv-pav" maxlength="3" placeholder="SIGLA">' +
           '<button class="cfg-btn pri" id="btn-add-pav">+ Adicionar pavimento</button></div>' +
           '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px">Entra no topo; depois ajuste a posição com as setas.</div>';

  if (inativos.length) {
    lista += '<div class="cfg-sec"><div class="cfg-sec-tit" id="tg-inativos">' + (VER_INATIVOS ? '▾' : '▸') +
             ' Desativados (' + inativos.length + ')</div>';
    if (VER_INATIVOS) inativos.forEach(p => {
      lista += '<div class="cfg-linha-sec"><span class="cfg-pav-sig">' + esc(p.sigla) + '</span><span style="flex:1"></span>' +
               '<button class="cfg-btn" data-reativar-pav="' + esc(p.sigla) + '">Reativar</button></div>';
    });
    lista += '</div>';
  }

  return '<div class="cfg-pav-wrap"><div class="cfg-pav-lista">' + lista + '</div>' +
    '<div class="cfg-ger"><div style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text2)">GER</div>' +
    '<div style="font-family:var(--sans);font-size:12px;color:var(--text3);margin-top:5px;line-height:1.55">Geral — para fichas e arquivos que não pertencem a um pavimento. Fixo, fora da ordem.</div></div>' +
  '</div>';

function menuPavimento(botao, sig) {
  const f = USO_PAV[sig] || 0;
  abrirMenu(botao, [
    ['Renomear sigla…', () => renomearPavimento(sig)],
    ['Desativar', () => {
      if (ordemMudou()) { alert('Salve ou descarte a nova ordem antes.'); return; }
      if (!confirm('Desativar ' + sig + '?\n\nEle deixa de aparecer como opção.' + (f ? '\nAs ' + f + ' fichas que o usam continuam com ele.' : ''))) return;
      operar(() => rpc('cfg_ativar_pavimento', { p_projeto: PROJ_ID, p_sigla: sig, p_ativo: false }), sig + ' desativado.');
    }, null, 'perigo'],
    ['Excluir', f ? null : () => {
      if (ordemMudou()) { alert('Salve ou descarte a nova ordem antes.'); return; }
      if (!confirm('Excluir ' + sig + ' definitivamente?')) return;
      operar(() => rpc('cfg_excluir_pavimento', { p_projeto: PROJ_ID, p_sigla: sig }), sig + ' excluído.');
    }, f ? 'Usado em ' + f + (f == 1 ? ' ficha' : ' fichas') + '. Desative em vez de excluir.' : null, 'perigo']
  ]);
}

function renomearPavimento(sig) {
  if (ordemMudou()) { alert('Salve ou descarte a nova ordem antes.'); return; }
  const f = USO_PAV[sig] || 0;
  const nova = (prompt('Nova sigla para ' + sig + ' (3 caracteres):', sig) || '').trim().toUpperCase();
  if (!nova || nova === sig) return;
  if (!/^[A-Z0-9]{3}$/.test(nova)) { alert('A sigla deve ter exatamente 3 letras ou números.'); return; }
  if (!confirm('Renomear ' + sig + ' para ' + nova + '?\n\n' +
               (f ? 'As ' + f + ' fichas que usam ' + sig + ' serão atualizadas junto.\n' : '') +
               'Um backup do projeto é criado antes, automaticamente.')) return;
  operar(() => rpc('cfg_renomear_pavimento', { p_projeto: PROJ_ID, p_antiga: sig, p_nova: nova }),
         sig + ' renomeado para ' + nova + '.');
}

// ── MENU FLUTUANTE ──
function abrirMenu(botao, itens) {
  fecharMenu();
  const m = document.createElement('div');
  m.className = 'cfg-menu'; m.id = 'cfg-menu';
  itens.forEach(([rot, acao, nota, classe]) => {
    const it = document.createElement('div');
    it.className = 'cfg-menu-it' + (acao ? '' : ' off') + (classe && acao ? ' ' + classe : '');
    it.textContent = rot;
    if (acao) it.onclick = () => { fecharMenu(); acao(); };
    m.appendChild(it);
    if (nota) {
      const n = document.createElement('div'); n.className = 'cfg-menu-nota'; n.textContent = nota;
      m.appendChild(n);
    }
  });
  document.body.appendChild(m);
  const r = botao.getBoundingClientRect();
  const larg = m.offsetWidth, alt = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - larg, window.innerWidth - larg - 8)) + 'px';
  m.style.top = (r.bottom + alt + 8 > window.innerHeight ? r.top - alt - 4 : r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', fecharMenu, { once: true }), 0);
}
function fecharMenu() { const m = document.getElementById('cfg-menu'); if (m) m.remove(); }

// ── EVENTOS ──
function ligarEventos() {
  const q = s => document.querySelectorAll(s);

  q('[data-disc]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    menuDisciplina(b, DISC.find(d => d.id === b.dataset.disc));
  });
  q('[data-associar]').forEach(b => b.onclick = () => modalAssociar(b.dataset.associar));
  q('[data-manter]').forEach(b => b.onclick = () =>
    operar(() => rpc('cfg_manter_avulsa', { p_projeto: PROJ_ID, p_pasta_drive_id: b.dataset.manter }),
           'Pasta mantida avulsa.'));
  q('[data-reativar]').forEach(b => b.onclick = () =>
    operar(() => rpc('cfg_ativar_disciplina', { p_id: b.dataset.reativar, p_ativa: true }), 'Disciplina reativada.'));

  const add = document.getElementById('btn-add-disc');
  if (add) add.onclick = modalAdicionar;
  const tgA = document.getElementById('tg-inativas'); if (tgA) tgA.onclick = () => { VER_INATIVAS = !VER_INATIVAS; render(); };
  const tgM = document.getElementById('tg-mantidas'); if (tgM) tgM.onclick = () => { VER_MANTIDAS = !VER_MANTIDAS; render(); };

  // pavimentos
  q('[data-sobe]').forEach(b => b.onclick = () => {
    const o = ordemAtual().slice(), i = +b.dataset.sobe;
    [o[i - 1], o[i]] = [o[i], o[i - 1]]; ORDEM_EDITADA = o; render();
  });
  q('[data-desce]').forEach(b => b.onclick = () => {
    const o = ordemAtual().slice(), i = +b.dataset.desce;
    [o[i + 1], o[i]] = [o[i], o[i + 1]]; ORDEM_EDITADA = o; render();
  });
  q('[data-pav]').forEach(b => b.onclick = e => { e.stopPropagation(); menuPavimento(b, b.dataset.pav); });
  q('[data-reativar-pav]').forEach(b => b.onclick = () =>
    operar(() => rpc('cfg_ativar_pavimento', { p_projeto: PROJ_ID, p_sigla: b.dataset.reativarPav, p_ativo: true }), 'Pavimento reativado.'));

  const salvar = document.getElementById('btn-salvar-ordem');
  if (salvar) salvar.onclick = () => {
    const deBaixoParaCima = ORDEM_EDITADA.slice().reverse();
    operar(() => rpc('cfg_reordenar_pavimentos', { p_projeto: PROJ_ID, p_siglas: deBaixoParaCima }), 'Ordem salva.');
  };
  const desc = document.getElementById('btn-desc-ordem');
  if (desc) desc.onclick = () => { ORDEM_EDITADA = null; render(); };

  const addPav = document.getElementById('btn-add-pav');
  if (addPav) addPav.onclick = () => {
    if (ordemMudou()) { alert('Salve ou descarte a nova ordem antes.'); return; }
    const s = document.getElementById('nv-pav').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{3}$/.test(s)) { alert('A sigla deve ter exatamente 3 letras ou números.'); return; }
    operar(() => rpc('cfg_adicionar_pavimento', { p_projeto: PROJ_ID, p_sigla: s }), s + ' adicionado no topo.');
  };
  const tgI = document.getElementById('tg-inativos'); if (tgI) tgI.onclick = () => { VER_INATIVOS = !VER_INATIVOS; render(); };

  // equipe
  q('[data-membro]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    menuMembro(b, MEMBROS.find(m => m.usuario_id === b.dataset.membro));
  });
  q('[data-papel]').forEach(s => s.onchange = () => {
    const m = MEMBROS.find(x => x.usuario_id === s.dataset.papel);
    operar(() => rpc('eq_papel', { p_projeto: PROJ_ID, p_usuario: s.dataset.papel, p_papel: s.value }),
           'Papel atualizado.');
  });
  const addP = document.getElementById('btn-add-pessoa');
  if (addP) addP.onclick = modalAdicionarPessoa;

  // dados gerais
  const btnDados = document.getElementById('dg-salvar');
  if (btnDados) btnDados.onclick = salvarDados;
  const btnDesfazer = document.getElementById('dg-desfazer');
  if (btnDesfazer) btnDesfazer.onclick = () => render();
}

// Aviso antes de sair com a ordem dos pavimentos alterada e não salva
window.addEventListener('beforeunload', e => { if (ordemMudou()) { e.preventDefault(); e.returnValue = ''; } });

function show(screen) {
  ['login','loading','app'].forEach(s => {
    const el = document.getElementById('screen-'+s);
    if (!el) return;
    if (s !== screen) { el.style.display = 'none'; return; }
    el.style.display = (s === 'app') ? 'block' : 'flex';
  });
  const sb = document.getElementById('ospa-sidebar');
  if (sb) sb.style.display = (screen === 'login') ? 'none' : '';
}

function setLoadingText(t) {
  document.getElementById('loading-text').textContent = t;
}

document.getElementById('login-form').addEventListener('submit', e => { e.preventDefault(); doLogin(); });

(async () => {
  show('loading');
  setLoadingText('Restaurando sessão…');
  const restored = await tryRestoreSession();
  if (restored) {
    await loadApp();
  } else {
    show('login');
  }
})();
</script>
</body>
</html>
