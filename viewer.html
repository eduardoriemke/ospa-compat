<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPA — Relatório de Compatibilização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#F8F8F8;color:#191919;min-height:100vh;display:flex;align-items:center;justify-content:center}
.loading{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#B5B5B5;letter-spacing:0.12em;text-align:center}
.loading h2{font-family:'IBM Plex Serif',serif;font-size:22px;font-weight:300;color:#191919;margin-bottom:12px}
.err{color:#C42828;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="loading" id="msg">
  <div id="msg-text">Carregando relatório…</div>
</div>
<script>
const SB_URL = "https://jxezjuovrxajjleyjdcs.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXpqdW92cnhhampsZXlqZGNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDcwNTksImV4cCI6MjA5NjA4MzA1OX0.vaHfGesmDhZVeDMl_GSQYyIhN7E0EvRvV1vMy2vRYZY";
const HDR    = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

async function load() {
  const params = new URLSearchParams(window.location.search);
  const pubId  = params.get('id');
  const projId = params.get('projeto');

  try {
    let pub;
    if (pubId) {
      const r = await fetch(SB_URL+'/rest/v1/publicacoes?id=eq.'+pubId+'&select=*', {headers:HDR});
      const data = await r.json();
      pub = data[0];
    } else if (projId) {
      // Get latest publication for project
      const r = await fetch(SB_URL+'/rest/v1/publicacoes?projeto_id=eq.'+projId+'&order=created_at.desc&limit=1&select=*', {headers:HDR});
      const data = await r.json();
      pub = data[0];
    }

    if (!pub) {
      document.getElementById('msg-text').innerHTML =
        '<div style="margin-bottom:8px">Relatório não encontrado.</div>' +
        '<div style="font-size:10px;color:#B5B5B5">Verifique o link ou solicite uma nova publicação.</div>';
      return;
    }

    // Build and render the viewer HTML from snapshot
    const html = pub.dados.html;
    document.open(); document.write(html); document.close();

  } catch(e) {
    document.getElementById('msg-text').innerHTML =
      'Erro ao carregar: ' + e.message;
  }
}
load();
</script>
</body>
</html>
